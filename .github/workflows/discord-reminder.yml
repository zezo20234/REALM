name: Discord Reminder

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - name: Send COME AND PLAY! x3
        run: |
          for i in 1 2 3; do
            curl -s -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
              -H "Content-Type: application/json" \
              -d '{"content": "COME AND PLAY!"}'
            sleep 2
          done
