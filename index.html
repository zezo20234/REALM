<script>
// loads a library from the first CDN that works (tries the next one if a file is missing/blocked)
window.LIBS = {
  qrcode: ['https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js', 'https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js', 'https://unpkg.com/qrcode-generator@1.4.4/qrcode.js'],
  jsQR: ['https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js', 'https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.min.js', 'https://unpkg.com/jsqr@1.4.0/dist/jsQR.js']
};
window.loadLib = async function (name) {
  if (window[name]) return true;
  for (const u of window.LIBS[name]) {
    const ok = await new Promise(r => { const s = document.createElement('script'); s.src = u; s.onload = () => r(true); s.onerror = () => { s.remove(); r(false); }; document.head.appendChild(s); });
    if (ok && window[name]) return true;
  }
  return false;
};
loadLib('qrcode'); loadLib('jsQR');
</script>
<style>
:root{--bg:#0e1120;--card:#171b30;--card2:#1e2340;--line:#2a3157;--text:#eef0ff;--mut:#8e95b8;--acc:#6c7bff;--ok:#2ecc8f;--bad:#ff5d73;--warn:#ffb84d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);transition:background-color 4s;color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{min-height:100vh}
h1,h2,h3{margin:0 0 12px}
.mut{color:var(--mut)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
input,select,textarea{width:100%;background:#0e1226;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 12px;font:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
label{display:block;margin:0 0 12px;color:var(--mut);font-size:13px}
label input,label select,label textarea{margin-top:5px;color:var(--text);font-size:15px}
label.chk{display:flex;gap:8px;align-items:center;color:var(--text)}
label.chk input{width:auto;margin:0}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.ok{background:var(--ok);color:#06241a}
.btn.bad{background:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.big{width:100%;padding:16px;font-size:17px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font-size:22px;margin-top:4px}
.tbl{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--card2)}
.pill.ok{background:#12372c;color:var(--ok)}.pill.bad{background:#40202a;color:var(--bad)}
/* landing */
.landing{max-width:760px;margin:0 auto;padding:40px 18px}
.landing a{display:block;text-decoration:none;color:inherit}
.choice{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;margin-bottom:16px}
.choice:hover{border-color:var(--acc)}
.choice .ico{font-size:34px}
/* admin shell */
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line);background:#0b0e1c;position:sticky;top:0;z-index:5}
.brand{font-weight:800;font-size:18px}
.shell{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 54px)}
.side{border-right:1px solid var(--line);padding:12px;background:#0b0e1c}
.side button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--mut);padding:10px 12px;border-radius:10px;font:inherit;cursor:pointer;margin-bottom:2px}
.side button.on,.side button:hover{background:var(--card2);color:var(--text)}
.main{padding:20px;max-width:1000px;width:100%}
@media(max-width:760px){.shell{grid-template-columns:1fr}.side{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}.side button{white-space:nowrap;width:auto}.grid2{grid-template-columns:1fr}.main{padding:14px}}

.me{max-width:520px;margin:0 auto;padding:0 14px 90px}
.meTop{display:flex;justify-content:space-between;align-items:center;padding:14px 0}

.bal small{opacity:.8}.bal b{display:block;font-size:30px;margin:4px 0 10px}

.item:last-child{border-bottom:0}
.post{padding:14px 0;border-bottom:1px solid var(--line)}

#shopOv .box{background:var(--card2);border:2px solid var(--acc);border-radius:24px;padding:36px 28px;width:min(560px,96vw)}

#shopOv.okk .box{border-color:#22c55e}#shopOv.err .box{border-color:#ef4444}
#payAnim{position:fixed;inset:0;z-index:90;display:flex;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 45%,#0f2a22f5,#070a16f7 70%);opacity:0;transition:opacity .25s;cursor:pointer;overflow:hidden;--c:#2ecc8f}
#payAnim.in{--c:#6c7bff;background:radial-gradient(circle at 50% 45%,#1a1f4cf5,#070a16f7 70%)}
#payAnim.show{opacity:1}
#payAnim .stage{position:relative;width:200px;height:200px;margin:0 auto 18px}
#payAnim .ring{position:absolute;inset:0;border-radius:50%;border:4px solid var(--c);opacity:0}
#payAnim.show .ring{animation:payRing 1.4s ease-out forwards}
#payAnim.show .ring.r2{animation-delay:.25s}#payAnim.show .ring.r3{animation-delay:.5s}
#payAnim .disc{position:absolute;inset:25px;border-radius:50%;background:var(--c);box-shadow:0 0 60px var(--c);transform:scale(0)}
#payAnim.show .disc{animation:payPop .6s cubic-bezier(.2,1.6,.4,1) .05s forwards}
#payAnim svg{position:absolute;inset:25px;width:150px;height:150px}
#payAnim svg path{fill:none;stroke:#fff;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60}
#payAnim.show svg path{animation:payTick .45s ease-out .45s forwards}
#payAnim .amt{font-size:clamp(40px,11vw,76px);font-weight:800;line-height:1;opacity:0;transform:translateY(20px) scale(.8)}
#payAnim.show .amt{animation:payUp .5s ease-out .7s forwards}
#payAnim .ttl{font-size:22px;font-weight:700;margin-bottom:8px;opacity:0}
#payAnim.show .ttl{animation:payUp .5s ease-out .55s forwards}
#payAnim .sub{color:var(--mut);margin-top:10px;opacity:0}
#payAnim.show .sub{animation:payUp .5s ease-out .9s forwards}
#payAnim i{position:absolute;left:50%;top:44%;width:10px;height:16px;border-radius:2px;opacity:0}
#payAnim.show i{animation:payConf 1.7s cubic-bezier(.15,.7,.3,1) var(--d) forwards}
@keyframes payRing{0%{transform:scale(.5);opacity:.9}100%{transform:scale(2.3);opacity:0}}
@keyframes payPop{to{transform:scale(1)}}
@keyframes payTick{to{stroke-dashoffset:0}}
@keyframes payUp{to{opacity:1;transform:none}}
@keyframes payConf{0%{opacity:1;transform:translate(-50%,-50%) rotate(0)}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r))}}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:#0b0e1c;border:1px solid var(--line);padding:10px 16px;border-radius:12px}
#toast div.bad{border-color:var(--bad)}#toast div.ok{border-color:var(--ok)}
.big-ok{text-align:center;padding:24px}.big-ok .tick{font-size:56px}
.seg{display:flex;gap:8px;margin-bottom:14px}.seg .btn{flex:1}
.vid{width:100%;max-height:360px;border:0;border-radius:12px;margin-top:8px;background:#000;aspect-ratio:16/9}
.cmts{margin-top:10px;padding:10px;background:#0e1226;border-radius:12px}
.cmt{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;padding:5px 0;font-size:14px;word-break:break-word}
.pulse{animation:p 1.2s infinite}@keyframes p{50%{opacity:.4}}
</style>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

/* ---------- settings ---------- */
const CUR = 'SAR';
const LINE_PRICE = 20;
const FREE_MB = 10; // every user starts with this, even without a line
const PACKS = [
  { id: 'mini', name: 'Mini', mb: 300,  price: 10 },
  { id: 'plus', name: 'Plus', mb: 1000, price: 25 },
  { id: 'max',  name: 'Max',  mb: 3000, price: 60 }

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const root = $('#root');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r2 = n => Math.round(n * 100) / 100;
const billVisible = b => !b.showAt || b.showAt <= Date.now();
const money = n => (Number(n) || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ' + CUR;
const when = t => t ? new Date(t).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : '';
function toast(m, k = 'ok') {
  const d = document.createElement('div'); d.className = k; d.textContent = m;
  $('#toast').appendChild(d); setTimeout(() => d.remove(), 3200);
}
function ask(title, fields, okLabel = 'OK') {
  return new Promise(res => {
    const d = $('#dlg');
    d.innerHTML = `<form method="dialog"><h3>${esc(title)}</h3>${fields.map(f =>
      `<label>${esc(f.label)}<input name="${f.name}" type="${f.type || 'text'}" value="${esc(f.value ?? '')}" ${f.attrs || ''}></label>`).join('')}
      <div class="row"><button class="btn" value="ok">${esc(okLabel)}</button><button class="btn ghost" value="x" formnovalidate>Cancel</button></div></form>`;
    d.onclose = () => {
      if (d.returnValue === 'ok') { const o = {}; new FormData(d.querySelector('form')).forEach((v, k) => o[k] = v); res(o); }
      else res(null);
    };
    d.returnValue = '';
    d.showModal();
  });
}
const subs = [];
const listen = (r, cb) => { subs.push(onValue(r, cb)); };
let billTick = null, popTimer = null;
/* ---------- loud scan beep ---------- */
let actx = null;
const primeAudio = () => { try { actx = actx || new (window.AudioContext || window.webkitAudioContext)(); if (actx.state === 'suspended') actx.resume(); } catch (e) { } };
['pointerdown', 'touchstart', 'click', 'keydown'].forEach(ev => document.addEventListener(ev, primeAudio, { passive: true }));
function beep() {
  try {
    primeAudio(); if (!actx) return;
    const t0 = actx.currentTime, comp = actx.createDynamicsCompressor(); comp.connect(actx.destination);
    [[1400, 0], [1900, 0.16]].forEach(([f, dt]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + dt); g.gain.exponentialRampToValueAtTime(1, t0 + dt + 0.01); g.gain.setValueAtTime(1, t0 + dt + 0.12); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + 0.15);
      o.connect(g); g.connect(comp); o.start(t0 + dt); o.stop(t0 + dt + 0.16);
    });
  } catch (e) { }
  if (navigator.vibrate) navigator.vibrate(200);
}
/* ---------- camera permission ---------- */
function camMsg(e) {
  if (!navigator.mediaDevices?.getUserMedia) return 'Camera needs a secure (https) page';
  if (e && (e.name === 'NotAllowedError' || e.name === 'SecurityError')) return 'Camera is blocked — allow it in your phone Settings → TapPay / browser → Camera';
  if (e && e.name === 'NotFoundError') return 'No camera found on this device';
  return 'Camera not available';
}
// asks the browser for camera access (shows the system pop-up)
async function askCamera() {
  try {
    const st = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    st.getTracks().forEach(t => t.stop()); localStorage.tp_cam = '1'; return { ok: true };
  } catch (e) { return { ok: false, msg: camMsg(e) }; }
}
// on opening the app: ask once per launch until camera is allowed
async function camPrompt() {
  if (sessionStorage.tp_camAsked) return;
  try { const q = await navigator.permissions?.query({ name: 'camera' }); if (q && q.state === 'granted') { localStorage.tp_cam = '1'; return; } } catch (e) { }
  sessionStorage.tp_camAsked = '1';
  const d = $('#dlg');
  d.innerHTML = `<h3>📷 Allow camera</h3><p class="mut">TapPay needs your camera to scan QR codes when you pay. Tap Allow, then choose "Allow" on the pop-up.</p><div class="row"><button class="btn" id="camOk" type="button">Allow camera</button><button class="btn ghost" id="camNo" type="button">Not now</button></div>`;
  d.onclose = null;
  $('#camNo').onclick = () => d.close();
  $('#camOk').onclick = async () => { const r = await askCamera(); d.close(); toast(r.ok ? 'Camera allowed ✅' : r.msg, r.ok ? 'ok' : 'bad'); };
  d.showModal();
}
// banner sliding in from the top: "New post by <user>"
function postPopup(p) {
  let el = $('#popup');
  if (!el) { el = document.createElement('div'); el.id = 'popup'; document.body.appendChild(el); }
  el.innerHTML = `<div class="pav">${esc((p.name || '?')[0].toUpperCase())}</div><div style="min-width:0"><small>${p.video ? '🎬 New video' : '📸 New post'}</small><b>${p.video ? 'New video' : 'New post'} by ${esc(p.name || 'someone')}</b><span class="mut">${esc(p.text || (p.img ? '📷 Photo' : p.video ? '🎬 Video' : ''))}</span></div>`;
  el.onclick = () => { el.classList.remove('show'); if (M.id) meShow('insta'); };
  requestAnimationFrame(() => el.classList.add('show'));
  clearTimeout(popTimer); popTimer = setTimeout(() => el.classList.remove('show'), p.video ? 9000 : 5000);
  if (p.video) beep(); else if (navigator.vibrate) navigator.vibrate(120);
}
function qrStop() { clearInterval(M.qrTimer); M.qrTimer = null; if (M.qrTok) { remove(ref(db, 'qr/' + M.qrTok)).catch(() => { }); M.qrTok = null; } }
function cleanup() { localReq = null; $('#payAnim')?.remove(); shopFlashing = false; shopHandler = null; $('#shopOv')?.remove(); shopCur = null; clearTimeout(popTimer); $('#popup')?.remove(); qrStop(); while (subs.length) subs.pop()(); stopMeter(); scanHandler = null; clearInterval(billTick); }

/* ---------- shared world clock: 1 full day = 5 real minutes, same for everyone ---------- */
// one full cycle = 10 real minutes: daytime 06:00–22:00 lasts 7 min, night 22:00–06:00 lasts 3 min
const DAYPART_MS = 7 * 60 * 1000, NIGHTPART_MS = 3 * 60 * 1000, DAY_MS = DAYPART_MS + NIGHTPART_MS;
const minToOff = mins => { const mm = (mins - 360 + 1440) % 1440; return mm < 960 ? mm / 960 * DAYPART_MS : DAYPART_MS + (mm - 960) / 480 * NIGHTPART_MS; };
const offToMin = x => x < DAYPART_MS ? 360 + x / DAYPART_MS * 960 : 1320 + (x - DAYPART_MS) / NIGHTPART_MS * 480;
// real timestamp of the next time the game clock shows `mins` (minutes since 00:00), after `after`
function nextGameTime(after, mins) {
  const base = clockStart == null ? Date.UTC(2026, 0, 1) : clockStart;
  const e = (pausedAt != null ? pausedAt + (after - Date.now()) : after + srvOffset) - base, off = minToOff(mins);
  let d = Math.floor(e / DAY_MS);
  if (d * DAY_MS + off <= e) d++;
  return base - srvOffset + d * DAY_MS + off;
}
const hhmm = m => String(Math.floor(m / 60)).padStart(2, '0') + ':' + String(m % 60).padStart(2, '0');
let clockStart = null, srvOffset = 0, pausedAt = null;
const nowSrv = () => pausedAt != null ? pausedAt : Date.now() + srvOffset;
onValue(ref(db, '.info/serverTimeOffset'), s => { srvOffset = s.val() || 0; });
onValue(ref(db, 'clock/start'), s => {
  if (s.val() == null) runTransaction(ref(db, 'clock/start'), c => c == null ? Date.now() + srvOffset : undefined).catch(() => { clockStart = Date.UTC(2026, 0, 1); });
  else clockStart = s.val();
  drawClock();
}, () => { clockStart = Date.UTC(2026, 0, 1); drawClock(); });
onValue(ref(db, 'clock/pausedAt'), s => {
  pausedAt = s.val();
  const b = document.getElementById('clkBtn'); if (b) b.textContent = pausedAt != null ? '▶ Resume time' : '⏸ Pause time';
  drawClock();
});
function gameTime() {
  if (clockStart == null) return null;
  const e = Math.max(0, nowSrv() - clockStart);
  const day = Math.floor(e / DAY_MS) + 1;
  const mins = Math.floor(offToMin(e % DAY_MS)) % 1440;
  return { day, h: Math.floor(mins / 60), m: mins % 60 };
}
function clockText() {
  const t = gameTime(); if (!t) return '🕒 …';
  const icon = PHASE[phaseOf(t.h)].icon;
  return `${pausedAt != null ? '⏸' : icon} Day ${t.day} · ${String(t.h).padStart(2, '0')}:${String(t.m).padStart(2, '0')}${pausedAt != null ? ' · paused' : ''}`;
}
const PHASE = { day: { icon: '☀️', bg: '#2f6db5', msg: '☀️ It is day time' }, dawn: { icon: '🌅', bg: '#6a4c93', msg: '🌅 The sun is rising' }, dusk: { icon: '🌇', bg: '#7a3e6b', msg: '🌇 Evening — night is coming' }, night: { icon: '🌙', bg: '#0e1120', msg: '🌙 Night has fallen' } };
const phaseOf = h => h >= 22 || h < 6 ? 'night' : h < 8 ? 'dawn' : h >= 20 ? 'dusk' : 'day';
let lastPhase = null;
function drawClock() {
  document.querySelectorAll('.gclock').forEach(el => el.textContent = clockText());
  const t = gameTime(); if (!t) return;
  const ph = phaseOf(t.h);
  document.documentElement.style.setProperty('--bg', PHASE[ph].bg);   // the page background fades with the time of day
  document.documentElement.dataset.tod = ph;
  if (ph !== lastPhase) { if (lastPhase !== null && pausedAt == null) toast(PHASE[ph].msg); lastPhase = ph; }
}
setInterval(drawClock, 1000);

/* ---------- hunger & energy: only the cashier computer can feed / sleep people ---------- */
const FOOD_DRAIN = 100 / (2 * DAY_MS), SLEEP_DRAIN = 100 / (1.5 * DAY_MS), SLEEP_GAIN = 100 / (0.4 * DAY_MS);   // full → empty in 2 days / 1.5 days; a nap refills in ~4 min
function vitalsNow(v) {
  v = v || {}; const t = Date.now();
  const food = Math.max(0, Math.min(100, (v.food ?? 100) - FOOD_DRAIN * (v.sleeping ? 0.5 : 1) * (t - (v.foodAt || t))));
  const e0 = v.energy ?? 100, dt = t - (v.energyAt || t);
  const energy = Math.max(0, Math.min(100, v.sleeping ? e0 + SLEEP_GAIN * dt : e0 - SLEEP_DRAIN * dt));
  return { food, energy, sleeping: !!v.sleeping };
}
const vbar = (id, label, val, col) => `<div style="margin:8px 0"><div class="row between" style="font-size:13px"><span>${label}</span><b id="${id}n">${Math.round(val)}%</b></div><div style="height:12px;background:rgba(128,128,128,.25);border-radius:8px;overflow:hidden"><div id="${id}" style="height:100%;width:${val}%;background:${val < 25 ? '#e5484d' : col};transition:width .6s"></div></div></div>`;
function vitalsHtml(v, who) {
  const n = vitalsNow(v);
  return vbar('vbF' + who, '🍔 Hunger (fullness)', n.food, '#f5a524') + vbar('vbE' + who, n.sleeping ? '😴 Sleeping…' : '⚡ Energy', n.energy, '#3e9bf0');
}
function vitalsTick() {
  for (const [who, v] of Object.entries(window.VIT_LIVE || {})) {
    const n = vitalsNow(v);
    [['vbF', n.food], ['vbE', n.energy]].forEach(([k, val]) => { const b = document.getElementById(k + who), t = document.getElementById(k + who + 'n'); if (b) { b.style.width = val + '%'; b.style.background = val < 25 ? '#e5484d' : (k === 'vbF' ? '#f5a524' : '#3e9bf0'); } if (t) t.textContent = Math.round(val) + '%'; });
  }
}

/* ---------- QR helpers ---------- */
// opens the camera in the dialog, resolves with the first QR text it reads (or null if cancelled)
function qrScan(title, hint) {
  return new Promise(async res => {
    if (!(await loadLib('jsQR'))) { toast('QR scanner could not load — your network may block the CDN', 'bad'); return res(null); }
    let stream;
    try { stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }); }
    catch (e) { toast(camMsg(e), 'bad'); return res(null); }
    const d = $('#dlg'); let timer, done = false;
    d.innerHTML = `<h3>${esc(title)}</h3><video id="qrVid" playsinline muted style="width:100%;border-radius:12px;background:#000"></video><p class="mut" style="font-size:13px">${esc(hint || '')}</p><div class="row"><button class="btn ghost" id="qrCancel" type="button">Cancel</button></div>`;
    const v = $('#qrVid'); v.srcObject = stream; v.play().catch(() => { });
    const finish = val => {
      if (done) return; done = true; clearInterval(timer);
      stream.getTracks().forEach(t => t.stop());
      d.onclose = null; if (d.open) d.close();
      setTimeout(() => res(val), 80); // let the dialog's close event pass before the caller opens another dialog
    };
    d.onclose = () => finish(null);
    $('#qrCancel').onclick = () => finish(null);
    const cv = document.createElement('canvas'), cx = cv.getContext('2d', { willReadFrequently: true });
    timer = setInterval(() => {
      if (!v.videoWidth) return;
      cv.width = v.videoWidth; cv.height = v.videoHeight; cx.drawImage(v, 0, 0);
      const r = jsQR(cx.getImageData(0, 0, cv.width, cv.height).data, cv.width, cv.height);
      if (r && r.data) { beep(); finish(r.data); }
    }, 250);
    d.showModal();
  });
}

// moves the account to a new card: new card must be unused, old card stops working
async function changeCard(id, newUid) {
  newUid = cleanUid(newUid); if (!newUid) return { ok: false, msg: 'Invalid card' };
  const a = await getAcc(id); if (!a) return { ok: false, msg: 'Account not found' };
  if (a.uid === newUid) return { ok: false, msg: 'That is already your card' };
  const cc = await runTransaction(ref(db, 'cards/' + newUid), c => c ? undefined : id);
  if (!cc.committed) return { ok: false, msg: 'That card is already registered' };
  await update(ref(db), { ['accounts/' + id + '/uid']: newUid, ['cards/' + a.uid]: null });
  return { ok: true };
}

/* ---------- payment animation: ring burst, drawn tick, confetti, counting amount, chime ---------- */
let payAnimT = null;
function chime() {
  try {
    primeAudio(); if (!actx) return;
    const t0 = actx.currentTime;
    [[660, 0], [880, 0.12], [1320, 0.24]].forEach(([f, dt]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t0 + dt); g.gain.exponentialRampToValueAtTime(0.9, t0 + dt + 0.02); g.gain.exponentialRampToValueAtTime(0.0001, t0 + dt + 0.5);
      o.connect(g); g.connect(actx.destination); o.start(t0 + dt); o.stop(t0 + dt + 0.55);
    });
  } catch (e) { }
  if (navigator.vibrate) navigator.vibrate([60, 40, 120]);
}
// kind: 'out' (you paid / payment accepted) or 'in' (you received money)
function payAnim({ amount, title = 'Payment successful', sub = '', kind = 'out' }) {
  let el = $('#payAnim'); if (el) el.remove();
  el = document.createElement('div'); el.id = 'payAnim'; el.className = kind === 'in' ? 'in' : '';
  const cols = kind === 'in' ? ['#6c7bff', '#a5b0ff', '#fff', '#ffb84d', '#2ecc8f'] : ['#2ecc8f', '#7dffcb', '#fff', '#ffb84d', '#6c7bff'];
  const conf = Array.from({ length: 44 }, () => {
    const a = Math.random() * Math.PI * 2, d = 140 + Math.random() * 260;
    return `<i style="background:${cols[Math.floor(Math.random() * cols.length)]};--x:${Math.cos(a) * d}px;--y:${Math.sin(a) * d + 120}px;--r:${Math.round(Math.random() * 900 - 450)}deg;--d:${(0.45 + Math.random() * 0.25).toFixed(2)}s"></i>`;
  }).join('');
  el.innerHTML = `${conf}<div><div class="stage"><div class="ring"></div><div class="ring r2"></div><div class="ring r3"></div><div class="disc"></div><svg viewBox="0 0 150 150"><path d="M42 78 L66 102 L110 52"/></svg></div><div class="ttl">${esc(title)}</div><div class="amt" style="color:var(--c)">${money(0)}</div>${sub ? `<div class="sub">${esc(sub)}</div>` : ''}</div>`;
  document.body.appendChild(el);
  requestAnimationFrame(() => el.classList.add('show'));
  const close = () => { el.classList.remove('show'); setTimeout(() => el.remove(), 300); };
  el.onclick = close; clearTimeout(payAnimT); payAnimT = setTimeout(close, 3200);
  const a = el.querySelector('.amt'), t0 = performance.now() + 700; // count the amount up as it appears
  const step = now => { const k = Math.min(1, Math.max(0, (now - t0) / 800)); a.textContent = money(Number(amount) * (1 - Math.pow(1 - k, 3))); if (k < 1 && el.isConnected) requestAnimationFrame(step); };
  requestAnimationFrame(step);
  chime();
}

/* ---------- redeem a winning lottery ticket (phone) ---------- */
async function redeemTicket(key) {
  const t = M.tickets[key]; if (!t || !t.prize || t.redeemed) return toast('Nothing to redeem', 'bad');
  // first pass of a transaction often sees an empty local cache (null): return it as-is so Firebase retries with the real server value
  let why = '';
  const claim = await runTransaction(ref(db, `lotTickets/${t.lid}/${t.code}`), c => {
    if (c === null) return c;
    if (c.acc !== M.id) { why = 'This ticket is not on your account'; return; }
    if (!c.prize) { why = 'This ticket did not win'; return; }
    if (c.redeemed) { why = 'Already redeemed'; return; }
    return { ...c, redeemed: true };
  });
  if (!claim.committed || !claim.snapshot.exists()) return toast(why || 'Could not redeem — ticket not found, ask the cashier', 'bad');
  const r = await credit(M.id, t.prize, `Lottery prize: ${t.lname} (#${t.code})`, 'lottery-win');
  if (!r.ok) { await update(ref(db, `lotTickets/${t.lid}/${t.code}`), { redeemed: false }); return toast(r.msg, 'bad'); }
  await update(ref(db, `userTickets/${M.id}/${key}`), { redeemed: true });
  payAnim({ amount: t.prize, title: 'You won!', sub: `${t.lname} · ticket ${t.code}`, kind: 'in' });
}

let shopCur = null, shopMsgT = null, shopFlashing = false, localReq = null; // localReq = charge started from the Charge tab

/* ---------- receipts & stock ---------- */
async function nextReceipt() { const r = await runTransaction(ref(db, 'meta/receipt'), c => (c || 0) + 1); return r.snapshot.val(); }
const recNo = n => '#' + String(n).padStart(4, '0');
async function recordReceipt(r) { await set(ref(db, 'receipts/' + r.no), { ...r, ts: Date.now() }); }
async function takeStock(shopId, items) {
  for (const it of items || []) if (it.id) await runTransaction(ref(db, `shopInfo/${shopId}/items/${it.id}/stock`), c => c === null ? c : Math.max(0, c - it.qty));
}
// takes the money from the customer, pays the receiver (if any), plays the animation. Returns {ok} or {ok:false,title,text}
async function chargeNow(cust, req) {
  if (req.to && req.to === cust) return { ok: false, title: "Can't pay yourself", text: 'Another person must tap their card.' };
  const cname = D.acc[cust]?.name || 'Customer', label = req.desc || 'Purchase', toName = req.to ? (D.acc[req.to]?.name || 'Shop') : 'Shop';
  if ((D.acc[cust]?.balance ?? Infinity) < req.amount) return { ok: false, title: 'Insufficient balance', text: 'Not enough money on this card.' };
  const no = await nextReceipt();
  const r = await debit(cust, req.amount, (req.to ? `${label} → ${toName}` : label) + ' · ' + recNo(no), 'pos');
  if (!r.ok) return { ok: false, title: r.msg, text: 'Not enough money on this card.' };
  if (req.to) await credit(req.to, req.amount, `${label} ← ${cname} · ${recNo(no)}`, 'pos-in');
  await recordReceipt({ no, shop: req.to || '', shopName: toName, buyer: cust, buyerName: cname, items: [{ n: label, q: 1, p: req.amount }], total: req.amount });
  payAnim({ amount: req.amount, title: 'Payment accepted', sub: `Receipt ${recNo(no)} · ${cname} → ${toName} · balance ${money(r.balance)}` });
  return { ok: true };
}
function drawShopOv(flash) {

  if (!on.length && !localReq) { shopCur = null; shopHandler = null; $('#shopOv')?.remove(); return; }

    shopHandler = async uid => {

      const r = await chargeNow(cust, x);

  }

    // claim this request so only one cashier page can charge it
    if ((D.acc[cust]?.balance ?? Infinity) < x.amount) return drawShopFlash('err', 'Insufficient balance', 'Not enough money on this card.', id, x);
    const claim = await runTransaction(ref(db, `shops/${id}/on`), c => c === null ? c : c === true ? false : undefined);
    if (!claim.committed) return;
    const cname = D.acc[cust]?.name || 'Customer', label = x.desc || 'Shop payment', no = await nextReceipt();

/* ---------- money core ---------- */
async function debit(id, amt, desc, type, extra = {}) {
  amt = Number(amt);
  if (!(amt > 0)) return { ok: false, msg: 'Invalid amount' };
  let msg = '';
  const res = await runTransaction(ref(db, 'accounts/' + id), a => {
    if (a === null) return a;
    if ((a.balance || 0) < amt) { msg = 'Insufficient balance'; return; }
    a.balance = r2((a.balance || 0) - amt);
    return a;
  });
  if (!res.committed || !res.snapshot.exists()) return { ok: false, msg: msg || 'Account not found' };
  const bal = res.snapshot.val().balance;
  await push(ref(db, 'tx/' + id), { type, amount: -amt, desc, balanceAfter: bal, ts: serverTimestamp(), ...extra });
  return { ok: true, balance: bal };
}
async function credit(id, amt, desc, type, extra = {}) {
  amt = Number(amt);
  if (!(amt > 0)) return { ok: false, msg: 'Invalid amount' };
  const res = await runTransaction(ref(db, 'accounts/' + id), a => {
    if (a === null) return a;
    a.balance = r2((a.balance || 0) + amt);
    return a;
  });
  if (!res.committed || !res.snapshot.exists()) return { ok: false, msg: 'Account not found' };
  const bal = res.snapshot.val().balance;
  await push(ref(db, 'tx/' + id), { type, amount: amt, desc, balanceAfter: bal, ts: serverTimestamp(), ...extra });
  return { ok: true, balance: bal };
}
async function accIdByUid(uid) { const s = await get(ref(db, 'cards/' + uid)); return s.exists() ? s.val() : null; }
async function getAcc(id) { const s = await get(ref(db, 'accounts/' + id)); return s.exists() ? { id, ...s.val() } : null; }
async function accIdByName(n) {
  n = String(n || '').trim().toLowerCase();
  if (!/^[a-z0-9_]{1,16}$/.test(n)) return null;
  const s = await get(ref(db, 'usernames/' + n)); return s.exists() ? s.val() : null;
}
// one place that creates accounts (cashier or the user on mobile): username + card UID (no PIN)
async function createAccount({ name, uid, balance = 0 }) {
  name = String(name || '').trim();
  if (!/^[A-Za-z0-9_]{3,16}$/.test(name)) return { ok: false, msg: 'Username: 3–16 letters, numbers or _' };
  uid = cleanUid(uid);
  if (!uid) return { ok: false, msg: 'Tap a card first' };
  if (await accIdByUid(uid)) return { ok: false, msg: 'This card is already registered' };
  const u = name.toLowerCase();
  let id; do { id = String(Math.floor(100000 + Math.random() * 900000)); } while ((await get(ref(db, 'accounts/' + id))).exists());
  const un = await runTransaction(ref(db, 'usernames/' + u), c => c ? undefined : id);
  if (!un.committed) return { ok: false, msg: 'Username already taken' };
  const cc = await runTransaction(ref(db, 'cards/' + uid), c => c ? undefined : id);
  if (!cc.committed) { await remove(ref(db, 'usernames/' + u)); return { ok: false, msg: 'This card is already registered' }; }
  await set(ref(db, 'accounts/' + id), { name, uid, balance: r2(balance), freeMB: FREE_MB, created: Date.now() });
  if (balance > 0) await push(ref(db, 'tx/' + id), { type: 'topup', amount: r2(balance), desc: 'Opening balance', balanceAfter: r2(balance), ts: serverTimestamp() });
  return { ok: true, id };
}

// one scan at a time: a duplicate tap while we're still looking up the card is ignored,
// so the screen is never re-drawn under the cashier's/customer's fingers
let scanBusy = false;
let shopHandler = null; // set while the cashier screen shows a payment request from a phone
async function runScan(uid) {
  if ((!scanHandler && !shopHandler) || scanBusy) return;
  scanBusy = true;
  try { await (shopHandler || scanHandler)(uid); } catch (e) { console.error(e); } finally { scanBusy = false; }
}
// re-render safely: remember which field has focus (and what was typed) and put it back
function keep(fn) {
  const a = document.activeElement;
  const id = a && a.id, tag = a && a.tagName;
  const typing = id && (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT');
  const val = typing ? a.value : null;
  const s = typing && a.selectionStart != null ? [a.selectionStart, a.selectionEnd] : null;
  fn();
  if (typing) {
    const n = document.getElementById(id);
    if (n && n !== a) {
      if (n.type !== 'file') n.value = val;
      n.focus();
      if (s) { try { n.setSelectionRange(s[0], s[1]); } catch (e) { } }
    }
  }
}

/* ---------- USB reader: Arduino Uno over Web Serial (cashier laptop) ---------- */
const SER = { port: null, reader: null, status: 'off', busy: false };
function serStatus(st) {
  SER.status = st;
  const b = $('#serBadge');
  if (b) { b.className = 'pill ' + (st === 'on' ? 'ok' : 'bad'); b.textContent = st === 'on' ? '🔌 Reader connected' : st === 'busy' ? '🔌 Connecting…' : '🔌 Reader not paired'; }
  const btn = $('#serBtn'); if (btn) btn.textContent = st === 'on' ? 'Disconnect' : 'Pair reader';
  const bn = $('#serBanner'); if (bn) bn.style.display = st === 'on' ? 'none' : 'flex';
  const bt = $('#serBannerTxt'); if (bt) bt.textContent = st === 'busy' ? 'Connecting to the reader…' : 'Card reader is not connected — plug in the Arduino and click Connect.';
  const r2el = $('#serInfo'); if (r2el) r2el.textContent = st === 'on' ? 'Connected — taps on the reader are sent to the system.' : 'Not connected. Plug in the Arduino Uno and press Pair reader (first time only).';
}
async function serOpen(port) {
  if (SER.busy || SER.status === 'on') return;
  SER.busy = true; serStatus('busy');
  try {
    await port.open({ baudRate: 9600 });
    SER.port = port; serStatus('on');
    const dec = new TextDecoderStream();
    const closed = port.readable.pipeTo(dec.writable).catch(() => { });
    const rd = dec.readable.getReader(); SER.reader = rd;
    let buf = '';
    (async () => {
      try {
        for (;;) {
          const { value, done } = await rd.read(); if (done) break;
          buf += value; let i;
          while ((i = buf.indexOf('\n')) >= 0) {
            const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
            if (line.startsWith('UID:')) pushScan(line.slice(4), 'usb');
          }
        }
      } catch (e) { }
      try { rd.releaseLock(); } catch (e) { }
      await closed;
      try { await port.close(); } catch (e) { }
      SER.port = null; SER.reader = null; serStatus('off');
    })();
  } catch (e) {
    serStatus('off');
    toast('Could not open the reader. Close the Arduino IDE Serial Monitor and try again.', 'bad');
  } finally { SER.busy = false; }
}
async function serPair() {
  if (!('serial' in navigator)) return toast('USB pairing needs desktop Chrome or Edge, opened over https or localhost', 'bad');
  if (SER.status === 'on') { SER.reader?.cancel(); return; }
  try { serOpen(await navigator.serial.requestPort()); } catch (e) { /* user closed the picker */ }
}
async function serAuto() {
  if (!('serial' in navigator)) return;
  try { const ports = await navigator.serial.getPorts(); if (ports.length) serOpen(ports[0]); } catch (e) { }
}
if ('serial' in navigator) {
  navigator.serial.addEventListener('connect', e => {
    if (sessionStorage.tp_admin === '1' && location.hash === '#admin') serOpen(e.target);
  });
}

let schedBusy = false, serRetry = 0;
// issues every automatic bill that is due. Only one cashier page wins each round (transaction on `next`).
async function runSchedules() {
  if (schedBusy || pausedAt != null) return; schedBusy = true;
  try {
    for (const [id, x] of Object.entries(D.sched)) {
      if (!x.active || !(x.next <= Date.now())) continue;
      const r = await runTransaction(ref(db, `schedules/${id}/next`), c => {
        if (c == null || c > Date.now()) return;
        const n = c + x.every; if (n > Date.now()) return n; return x.at != null ? nextGameTime(Date.now(), x.at) : Date.now() + x.every;
      });
      if (!r.committed) continue;
      const targets = x.acc === 'all' ? Object.keys(D.acc) : x.acc === 'shops' ? Object.keys(D.shopInfo || {}).filter(i => D.acc[i]) : D.acc[x.acc] ? [x.acc] : [];
      for (const acc of targets) {
        const nb = push(ref(db, 'bills/' + acc));
        await set(nb, { title: x.title, amount: x.amount, due: '', status: 'unpaid', created: Date.now(), showAt: Date.now(), sched: id });
        if (x.auto) {
          const p = await debit(acc, x.amount, 'Bill: ' + x.title, 'bill');
          if (p.ok) await update(nb, { status: 'paid', paidAt: Date.now() });
        }
      }
    }
  } catch (e) { console.error(e); } finally { schedBusy = false; }
}

/* --- fake customers: make orders yourself so shops get sales --- */
const FAKE_NAMES = ['Sara', 'Omar', 'Lina', 'Khalid', 'Noor', 'Yusuf', 'Maya', 'Faisal', 'Huda', 'Zain', 'Reem', 'Adam', 'Dana', 'Tariq'];
let fakeTimer = null;
async function fakeOrder(shopId, picks, name) {
  const x = (D.shopInfo || {})[shopId]; if (!x) return false;
  const all = Object.entries(x.items || {}).filter(([, i]) => (i.stock || 0) > 0 && i.price > 0);
  if (!picks) { if (!all.length) return false; const n = 1 + Math.floor(Math.random() * Math.min(3, all.length)); picks = [...all].sort(() => Math.random() - .5).slice(0, n).map(([id, i]) => ({ id, qty: Math.min(i.stock, 1 + Math.floor(Math.random() * 3)) })); }
  const its = picks.map(p => { const i = x.items[p.id]; return i ? { id: p.id, n: i.name, q: Math.min(p.qty, i.stock || 0), p: i.price } : null; }).filter(i => i && i.q > 0);
  if (!its.length) return false;
  const total = r2(its.reduce((a, i) => a + i.q * i.p, 0)), cname = (name || FAKE_NAMES[Math.floor(Math.random() * FAKE_NAMES.length)]) + ' (guest)';
  const no = await nextReceipt();
  await credit(shopId, total, `${cname} · ${recNo(no)}`, 'pos-in');
  await recordReceipt({ no, shop: shopId, shopName: x.name || accName(shopId), buyer: 'fake', buyerName: cname, items: its.map(({ n, q, p }) => ({ n, q, p })), total });
  await takeStock(shopId, its.map(i => ({ id: i.id, qty: i.q })));
  await update(ref(db, 'shops/' + shopId), { last: { by: cname, amount: total, desc: its.map(i => `${i.q}× ${i.n}`).join(', '), ts: Date.now(), receipt: no } });
  return true;
}

    const r = await debit(acc, total, `Lottery: ${x.name} × ${qty}`, 'lottery'); if (!r.ok) return toast(r.msg, 'bad');
    const used = new Set(Object.keys((D.lotT || {})[lid] || {})), codes = [], up = {}, ts = Date.now();
    while (codes.length < qty) { const c = String(Math.floor(100000 + Math.random() * 900000)); if (used.has(c)) continue; used.add(c); codes.push(c); }
    codes.forEach(c => {
      up[`lotTickets/${lid}/${c}`] = { acc, name, ts, prize: null, redeemed: false };
      up[`userTickets/${acc}/${lid}_${c}`] = { lid, code: c, lname: x.name, ts, prize: null, redeemed: false, drawn: false };
    });
    await update(ref(db), up);
    payAnim({ amount: total, title: `${qty} ticket${qty > 1 ? 's' : ''} sold`, sub: `${name} · ${codes.slice(0, 5).join(', ')}${codes.length > 5 ? '…' : ''}` });

  async lotDraw(d) {
    const x = (D.lot || {})[d.id]; if (!x || x.status !== 'open') return;

    if (!codes.length) return toast('No tickets sold yet', 'bad');
    if (!confirm(`Draw ${Math.min(x.prizes.length, codes.length)} winner(s) for "${x.name}" now? Tickets can't be sold after this.`)) return;
    const a = codes.slice(), rnd = n => { const u = new Uint32Array(1); crypto.getRandomValues(u); return u[0] % n; };
    for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; }
    const t = (D.lotT || {})[d.id], up = { [`lotteries/${d.id}/status`]: 'drawn', [`lotteries/${d.id}/drawnAt`]: Date.now() };
    codes.forEach(c => { up[`userTickets/${t[c].acc}/${d.id}_${c}/drawn`] = true; });
    a.slice(0, x.prizes.length).forEach((c, i) => { up[`lotTickets/${d.id}/${c}/prize`] = x.prizes[i]; up[`userTickets/${t[c].acc}/${d.id}_${c}/prize`] = x.prizes[i]; });

/* --- Instazyad: 1 MB of data per second while open --- */
const meter = { timer: null, pending: 0, inflight: 0 };
const dataLeft = () => Math.max(0, (M.acc?.freeMB || 0) + (M.acc?.line?.dataMB || 0) - meter.pending - meter.inflight);
function startMeter() {
  stopMeter();
  meter.timer = setInterval(() => {
    if (document.hidden) return;
    if (dataLeft() <= 0) { flushMeter(); ME.insta.refresh(); stopMeter(); return; }
    meter.pending++; updateMeterUI();
    if (meter.pending >= 5) flushMeter();
  }, 1000);
}
function stopMeter() { if (meter.timer) { clearInterval(meter.timer); meter.timer = null; } flushMeter(); }
async function flushMeter() {
  const n = meter.pending; if (!n || !M.id) return;
  meter.pending = 0; meter.inflight += n;
  try {
    await runTransaction(ref(db, 'accounts/' + M.id), a => {
      if (!a) return a;
      const f = Math.min(a.freeMB || 0, n);
      a.freeMB = (a.freeMB || 0) - f;
      const rest = n - f;
      if (rest && a.line) a.line.dataMB = Math.max(0, (a.line.dataMB || 0) - rest);
      return a;
    });
  }
  finally { meter.inflight -= n; }
}
function updateMeterUI() {
  const el = $('#dataLeft'); if (el) el.textContent = dataLeft() + ' MB';
  const bar = $('#dataBar'); if (bar) bar.style.width = Math.min(100, dataLeft() / 10) + '%';
}
document.addEventListener('visibilitychange', () => { if (document.hidden) flushMeter(); });
window.addEventListener('pagehide', flushMeter);

    const l = M.acc.line, left = dataLeft();
    const st = left > 0 ? 'ok' : l ? 'nodata' : 'noline';
    $('#iHead').innerHTML = `<div class="row between"><b>📸 Instazyad</b><span class="mut">📶 <b id="dataLeft" style="color:var(--text)">${left} MB</b></span></div><div class="meter"><i id="dataBar" style="width:${Math.min(100, left / 10)}%"></i></div><p class="mut" style="margin:8px 0 0;font-size:12px">Using 1 MB per second while this page is open.${M.acc.freeMB ? ` 🎁 ${M.acc.freeMB} MB free data is used first.` : ''}</p>`;
    if (st === M.iState) return;
    M.iState = st;
    if (st === 'ok') {
      $('#iBody').innerHTML = `<div class="card"><textarea id="pText" rows="2" placeholder="What's on your mind?"></textarea>
      <div id="pPrev"></div><div class="row between" style="margin-top:10px"><div class="row"><label class="btn ghost sm" style="margin:0;cursor:pointer">🖼️ Photo<input type="file" id="pFile" accept="image/*" hidden></label><label class="btn ghost sm" style="margin:0;cursor:pointer">🎬 Video<input type="file" id="vFile" accept="video/*" hidden></label><button class="btn ghost sm" data-act="mvlink">🔗 Video link</button></div><button class="btn" data-act="mpost">Post</button></div></div><div class="card" id="feed"></div>`;
      $('#pFile').onchange = pickImg; $('#vFile').onchange = pickVid; ME.insta.feed(true);
    } else {
      stopMeter();
      $('#iBody').innerHTML = `<div class="card big-ok"><div class="tick">${st === 'noline' ? '📵' : '🪫'}</div><h3>${st === 'noline' ? 'Your free data is finished' : "You're out of data"}</h3><p class="mut">${st === 'noline' ? 'Buy a line, then a package, to keep using Instazyad.' : 'Buy a package to keep scrolling.'}</p><button class="btn" data-act="mtab" data-k="phone">Go to Phone</button></div>`;
    }
  },
  feed(force) {
    const el = $('#feed'); if (!el) return;
    if (!force && [...el.querySelectorAll('video')].some(v => !v.paused)) return; // don't interrupt a playing video
    const list = Object.entries(M.posts).sort((a, b) => (b[1].ts || 0) - (a[1].ts || 0));
    keep(() => {
      el.innerHTML = list.length ? list.map(([id, p]) => {
        const likes = Object.keys(p.likes || {}).length, mine = p.likes?.[M.id];
        const cm = Object.entries(p.comments || {}).sort((a, b) => (a[1].ts || 0) - (b[1].ts || 0));
        return `<div class="post"><div class="row" style="flex-wrap:nowrap"><div class="av">${esc((p.name || '?')[0].toUpperCase())}</div><div><b>${esc(p.name)}</b><br><span class="mut" style="font-size:12px">${when(p.ts)}</span></div></div>
        ${p.text ? `<p style="margin:10px 0 0;white-space:pre-wrap">${esc(p.text)}</p>` : ''}${p.img ? `<img src="${esc(p.img)}" alt="">` : ''}${vidHtml(id, p)}
        <div class="row" style="margin-top:10px"><button class="btn ghost sm" data-act="mlike" data-id="${id}">${mine ? '❤️' : '🤍'} ${likes}</button><button class="btn ghost sm" data-act="mctoggle" data-id="${id}">💬 ${cm.length}</button>${p.acc === M.id ? `<button class="btn ghost sm" data-act="mdelpost" data-id="${id}">🗑️</button>` : ''}</div>
        ${M.openC[id] ? `<div class="cmts">${cm.length ? cm.map(([cid, c]) => `<div class="cmt"><span><b>${esc(c.name)}</b> ${esc(c.text)}</span>${c.acc === M.id ? `<button class="btn ghost sm" data-act="mdelc" data-id="${id}" data-c="${cid}">✕</button>` : ''}</div>`).join('') : '<p class="mut" style="margin:0 0 8px">No comments yet.</p>'}
          <div class="row" style="flex-wrap:nowrap;margin-top:6px"><input id="cIn_${id}" placeholder="Write a comment…" maxlength="300"><button class="btn sm" data-act="mcomment" data-id="${id}">Send</button></div></div>` : ''}</div>`;
      }).join('') : '<p class="mut">No posts yet — be the first!</p>';
    });
  }
};
function vidHtml(id, p) {
  const v = p.video; if (!v) return '';
  if (v.kind === 'url') {
    const m = String(v.url).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|shorts\/|embed\/))([\w-]{11})/);
    if (m) return `<iframe class="vid" src="https://www.youtube.com/embed/${m[1]}" allowfullscreen loading="lazy"></iframe>`;
    return `<video class="vid" controls playsinline preload="metadata" src="${esc(v.url)}"></video>`;
  }
  if (M.vids[id]) return `<video class="vid" controls playsinline src="${M.vids[id]}"></video>`;
  return `<div style="margin-top:8px"><button class="btn ghost" data-act="mplayvid" data-id="${id}">▶ Play video</button></div>`;
}
function pickVid(e) {
  const f = e.target.files[0]; if (!f) return;
  if (f.size > 4 * 1024 * 1024) { e.target.value = ''; return toast('Video too big (max 4 MB). Use 🔗 Video link for bigger ones.', 'bad'); }
  const r = new FileReader();
  r.onload = () => { M.vid = { kind: 'file', data: r.result }; $('#pPrev').insertAdjacentHTML('beforeend', `<div id="vPrev"><video controls playsinline src="${r.result}" style="max-height:160px;border-radius:10px;margin-top:8px"></video></div>`); };
  r.readAsDataURL(f);
}
function pickImg(e) {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    const s = Math.min(1, 640 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = img.width * s; c.height = img.height * s;
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    M.img = c.toDataURL('image/jpeg', 0.6);
    $('#pPrev').innerHTML = `<img src="${M.img}" style="max-height:160px;border-radius:10px;margin-top:8px">`;
  };
  img.src = URL.createObjectURL(f);
}

route();
</script>
</body>
</html>
