<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Economy - Madrid & Barcelona</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #581c87 50%, #0f172a 100%);
            min-height: 100vh;
            color: #fff;
        }

        /* Navigation */
        .navbar {
            background: rgba(15, 23, 42, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 64px;
        }

        .nav-brand {
            font-size: 1.25rem;
            font-weight: bold;
        }

        .gradient-text {
            background: linear-gradient(to right, #facc15, #f97316);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .nav-tabs {
            display: flex;
            gap: 1rem;
        }

        .nav-tab {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
            background: transparent;
            border: none;
            color: #d1d5db;
            cursor: pointer;
        }

        .nav-tab:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .nav-tab.active {
            background: linear-gradient(to right, #facc15, #f97316);
            color: white;
        }

        /* Main Content */
        .main-content {
            padding: 2rem 1rem;
        }

        .container {
            max-width: 1280px;
            margin: 0 auto;
        }

        .page {
            display: none;
        }

        .page.active {
            display: block;
        }

        /* Header Section */
        .header-section {
            margin-bottom: 2rem;
        }

        .header-section h1 {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 1rem;
        }

        .header-section p {
            color: #d1d5db;
        }

        .header-controls {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: flex-start;
        }

        @media (min-width: 640px) {
            .header-controls {
                flex-direction: row;
                align-items: center;
                justify-content: space-between;
            }
        }

        /* City Toggle */
        .city-toggle {
            display: flex;
            gap: 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 0.5rem;
            padding: 0.25rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .city-btn {
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
            background: transparent;
            border: none;
            color: #d1d5db;
            cursor: pointer;
        }

        .city-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .city-btn.active {
            background: linear-gradient(to right, #facc15, #f97316);
            color: white;
        }

        .items-count {
            color: #d1d5db;
            font-size: 0.875rem;
        }

        /* Header with glassmorphism */
        .header-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 1rem;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        /* Filters Section */
        .filters-section {
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .search-container {
            position: relative;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 0.75rem;
            padding: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .search-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #9ca3af;
        }

        #search-input {
            width: 100%;
            padding: 0.5rem 1rem 0.5rem 2.5rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 0.375rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: white;
            font-size: 0.875rem;
        }

        #search-input::placeholder {
            color: #9ca3af;
        }

        #search-input:focus {
            outline: none;
            border-color: #facc15;
        }

        .category-filters {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 0.75rem;
            padding: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
        }

        .category-btn {
            padding: 0.375rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #d1d5db;
            cursor: pointer;
        }

        .category-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .category-btn.active {
            background: linear-gradient(to right, #facc15, #f97316);
            color: white;
            border: none;
        }

        /* Items Grid */
        .items-grid {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 1rem;
            margin-bottom: 2rem;
        }

        @media (min-width: 640px) {
            .items-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (min-width: 1024px) {
            .items-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }

        @media (min-width: 1280px) {
            .items-grid {
                grid-template-columns: repeat(4, 1fr);
            }
        }

        .item-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 0.75rem;
            padding: 1rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.2s;
        }

        .item-card:hover {
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            border-color: rgba(250, 204, 21, 0.5);
        }

        .item-header {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 0.75rem;
        }

        .item-icon {
            width: 3rem;
            height: 3rem;
            background: linear-gradient(to bottom right, rgba(250, 204, 21, 0.2), rgba(249, 115, 22, 0.2));
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(250, 204, 21, 0.3);
        }

        .item-icon svg {
            color: #facc15;
        }

        .item-info h3 {
            font-weight: 600;
            color: white;
            margin-bottom: 0.25rem;
        }

        .item-info p {
            font-size: 0.75rem;
            color: #9ca3af;
            text-transform: capitalize;
        }

        .item-price {
            margin-bottom: 0.75rem;
        }

        .item-price .price {
            font-size: 1.5rem;
            font-weight: bold;
            color: white;
        }

        .item-price .per-item {
            font-size: 0.75rem;
            color: #9ca3af;
        }

        .item-controls {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .quantity-selector {
            display: flex;
            gap: 0.5rem;
        }

        .quantity-btn {
            flex: 1;
            padding: 0.5rem 0.75rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #d1d5db;
            cursor: pointer;
        }

        .quantity-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .quantity-btn.active {
            background: linear-gradient(to right, #facc15, #f97316);
            color: white;
            border: none;
        }

        .quantity-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .quantity-input-group {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .quantity-input-group label {
            font-size: 0.875rem;
            color: #9ca3af;
        }

        .quantity-input-group input {
            width: 5rem;
            padding: 0.25rem 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 0.375rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            color: white;
            font-size: 0.875rem;
        }

        .quantity-input-group input:focus {
            outline: none;
            border-color: #facc15;
        }

        .add-to-cart-btn {
            width: 100%;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
            background: linear-gradient(to right, #22c55e, #10b981);
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .add-to-cart-btn:hover {
            background: linear-gradient(to right, #16a34a, #059669);
        }

        /* Pagination */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        .pagination button {
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            transition: all 0.2s;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            cursor: pointer;
        }

        .pagination button:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.2);
        }

        .pagination button.active {
            background: linear-gradient(to right, #facc15, #f97316);
            color: white;
            font-weight: bold;
        }

        .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Jobs Grid */
        .jobs-grid {
            display: grid;
            grid-template-columns: repeat(1, 1fr);
            gap: 1.5rem;
        }

        @media (min-width: 768px) {
            .jobs-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .job-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 0.75rem;
            padding: 1.5rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.2s;
        }

        .job-card:hover {
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            border-color: rgba(250, 204, 21, 0.5);
        }

        .job-header {
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 1rem;
        }

        .job-icon {
            width: 3rem;
            height: 3rem;
            background: linear-gradient(to bottom right, rgba(250, 204, 21, 0.2), rgba(249, 115, 22, 0.2));
            border-radius: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(250, 204, 21, 0.3);
        }

        .job-icon svg {
            color: #facc15;
        }

        .job-info h2 {
            font-size: 1.25rem;
            font-weight: 600;
            color: white;
        }

        .job-description {
            color: #d1d5db;
            margin-bottom: 1rem;
        }

        .job-cities {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .job-cities svg {
            color: #9ca3af;
        }

        .city-tag {
            padding: 0.25rem 0.5rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 9999px;
            font-size: 0.75rem;
            color: #d1d5db;
        }

        .job-pricing {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 1rem;
        }

        .job-pricing h3 {
            font-size: 0.875rem;
            font-weight: 600;
            color: white;
            margin-bottom: 0.75rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .job-pricing h3 svg {
            color: #facc15;
        }

        .pricing-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 0.375rem;
            padding: 0.75rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 0.5rem;
        }

        .pricing-item-info h4 {
            font-size: 0.875rem;
            font-weight: 500;
            color: white;
        }

        .pricing-item-info p {
            font-size: 0.75rem;
            color: #9ca3af;
            margin-top: 0.25rem;
        }

        .pricing-item-price {
            font-size: 1.125rem;
            font-weight: bold;
            color: #facc15;
        }

        .mayor-note {
            margin-top: 1rem;
            padding: 0.75rem;
            background: rgba(250, 204, 21, 0.1);
            border: 1px solid rgba(250, 204, 21, 0.3);
            border-radius: 0.375rem;
        }

        .mayor-note p {
            font-size: 0.875rem;
            color: #fde047;
        }

        .mayor-note svg {
            color: #facc15;
        }

        /* Cart Button */
        .cart-button {
            position: fixed;
            bottom: 1.5rem;
            right: 1.5rem;
            background: linear-gradient(to right, #facc15, #f97316);
            color: white;
            border: none;
            border-radius: 50%;
            width: 3rem;
            height: 3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            transition: all 0.2s;
            z-index: 1000;
        }

        .cart-button:hover {
            transform: scale(1.05);
            background: linear-gradient(to right, #eab308, #ea580c);
        }

        .cart-count {
            position: absolute;
            top: -0.5rem;
            right: -0.5rem;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            width: 1.5rem;
            height: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: bold;
        }

        /* Cart Modal */
        .cart-modal {
            position: fixed;
            inset: 0;
            z-index: 1001;
            display: none;
        }

        .cart-modal.active {
            display: block;
        }

        .cart-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
        }

        .cart-content {
            position: absolute;
            right: 0;
            top: 0;
            width: 100%;
            max-width: 28rem;
            height: 100%;
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(10px);
            border-left: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            flex-direction: column;
        }

        .cart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .cart-header h2 {
            font-size: 1.25rem;
            font-weight: bold;
            color: white;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: white;
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 50%;
            transition: all 0.2s;
        }

        .close-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        .cart-items {
            flex: 1;
            overflow-y: auto;
            padding: 1rem;
        }

        .cart-empty {
            text-align: center;
            padding: 3rem 1rem;
        }

        .cart-empty svg {
            width: 4rem;
            height: 4rem;
            color: #6b7280;
            margin: 0 auto 1rem;
        }

        .cart-empty p {
            color: #9ca3af;
        }

        .cart-item {
            display: flex;
            gap: 1rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 1rem;
        }

        .cart-item-info {
            flex: 1;
        }

        .cart-item-info h3 {
            font-weight: 500;
            color: white;
            margin-bottom: 0.25rem;
        }

        .cart-item-info p {
            font-size: 0.875rem;
            color: #9ca3af;
        }

        .cart-item-info .price {
            font-size: 0.875rem;
            font-weight: 500;
            color: #facc15;
        }

        .cart-item-actions {
            text-align: right;
        }

        .cart-item-actions .total {
            font-weight: bold;
            color: white;
            margin-bottom: 0.5rem;
        }

        .remove-btn {
            background: transparent;
            border: none;
            color: #f87171;
            cursor: pointer;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .remove-btn:hover {
            color: #fca5a5;
        }

        .cart-footer {
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding: 1rem;
        }

        .cart-totals {
            margin-bottom: 1rem;
        }

        .cart-totals .row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
        }

        .cart-totals .row.total {
            font-size: 1.25rem;
            font-weight: bold;
            padding-top: 0.5rem;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .cart-totals .row.total .amount {
            color: #facc15;
        }

        .cart-actions {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .copy-receipt-btn {
            width: 100%;
            padding: 0.75rem 1rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
            background: linear-gradient(to right, #22c55e, #10b981);
            color: white;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
        }

        .copy-receipt-btn:hover {
            background: linear-gradient(to right, #16a34a, #059669);
        }

        .clear-cart-btn {
            width: 100%;
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            font-weight: 500;
            transition: all 0.2s;
            background: rgba(239, 68, 68, 0.2);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.3);
            cursor: pointer;
        }

        .clear-cart-btn:hover {
            background: rgba(239, 68, 68, 0.3);
        }

        /* Responsive */
        @media (max-width: 640px) {
            .nav-container {
                flex-direction: column;
                height: auto;
                padding: 1rem;
            }

            .nav-tabs {
                width: 100%;
                justify-content: center;
            }

            .cart-content {
                max-width: 100%;
            }
        }
    </style>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-container">
            <div class="nav-brand">
                <span class="gradient-text">Minecraft Economy</span>
            </div>
            <div class="nav-tabs">
                <button class="nav-tab active" data-page="shop">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="9" cy="21" r="1"></circle>
                        <circle cx="20" cy="21" r="1"></circle>
                        <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                    </svg>
                    Market Shop
                </button>
                <button class="nav-tab" data-page="jobs">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="7" width="20" height="14" rx="2" ry="2"></rect>
                        <path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16"></path>
                    </svg>
                    Job Board
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Market Shop Page -->
        <div id="shop-page" class="page active">
            <div class="container">
                <!-- Header -->
                <div class="header-section">
                    <h1 class="gradient-text">Market Shop</h1>
                    <div class="header-controls">
                        <div class="city-toggle">
                            <button class="city-btn active" data-city="Madrid">Madrid</button>
                            <button class="city-btn" data-city="Barcelona">Barcelona</button>
                        </div>
                        <div class="items-count">Showing <span id="items-count">0</span> items</div>
                    </div>
                </div>

                <!-- Search and Filters -->
                <div class="filters-section">
                    <div class="search-container">
                        <svg class="search-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="11" cy="11" r="8"></circle>
                            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                        </svg>

        // Load items data (now embedded directly)
        function loadItems() {
            // Items are now embedded directly in this file
            filteredItems = [...items];
            renderItems();
            updateItemsCount();
        }
        
        // Application state
        let currentCity = 'Madrid';
        let currentPage = 1;
        let itemsPerPage = 24;
        let cart = [];
        let searchQuery = '';
        let selectedCategory = 'All';
        let filteredItems = [];
        
        // Navigation
        function showPage(pageName) {
            document.querySelectorAll('.page').forEach(page => {
                page.classList.remove('active');
            });
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            
            document.getElementById(`${pageName}-page`).classList.add('active');
            document.querySelector(`[data-page="${pageName}"]`).classList.add('active');
        }

        // City Toggle
        function setCity(city) {
            currentCity = city;
            document.querySelectorAll('.city-btn').forEach(btn => {
                btn.classList.remove('active');
                if (btn.dataset.city === city) {
                    btn.classList.add('active');
                }
            });
            filterItems();
            renderItems();
            updateCartDisplay();
        }

        // Filter Items
        function filterItems() {
            filteredItems = items.filter(item => {
                const matchesSearch = item.name.toLowerCase().includes(searchQuery.toLowerCase());
                const matchesCategory = selectedCategory === 'All' || item.category === selectedCategory;
                return matchesSearch && matchesCategory;
            });
            currentPage = 1;
        }

        // Render Items
        function renderItems() {
            const grid = document.getElementById('items-grid');
            const startIndex = (currentPage - 1) * itemsPerPage;
            const endIndex = startIndex + itemsPerPage;
            const currentItems = filteredItems.slice(startIndex, endIndex);

            if (currentItems.length === 0) {
                grid.innerHTML = `
                    <div class="cart-empty" style="grid-column: 1 / -1;">
                        <p>No items found matching your criteria.</p>
                    </div>
                `;
                return;
            }

            grid.innerHTML = currentItems.map(item => {
                const price = currentCity === 'Madrid' ? item.price_madrid_single : item.price_barcelona_single;
                return `
                    <div class="item-card" data-item-id="${item.id}">
                        <div class="item-header">
                            <div class="item-icon">
                                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"></path>
                                    <polyline points="3.27 6.96 12 12.01 20.73 6.96"></polyline>
                                    <line x1="12" y1="22.08" x2="12" y2="12"></line>
                                </svg>
                            </div>
                            <div class="item-info">
                                <h3>${item.name}</h3>
                                <p>${item.category.replace('_', ' ')}</p>
                            </div>
                        </div>
                        <div class="item-price">
                            <div class="price">€${price.toFixed(2)}</div>
                        </div>
                        <div class="item-controls">
                            <div class="quantity-selector">
                                <button class="quantity-btn active" data-quantity-type="single">Single</button>
                                <button class="quantity-btn" data-quantity-type="stack" ${!item.is_stackable ? 'disabled' : ''}>Stack (64x)</button>
                            </div>
                            <div class="quantity-input-group">
                                <label>Qty:</label>
                                <input type="number" min="1" max="64" value="1" class="quantity-input">
                            </div>
                            <button class="add-to-cart-btn" data-item-id="${item.id}">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <line x1="12" y1="5" x2="12" y2="19"></line>
                                    <line x1="5" y1="12" x2="19" y2="12"></line>
                                </svg>
                                Add to Cart
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            renderPagination();
            attachItemEventListeners();
        }

        // Render Pagination
        function renderPagination() {
            const pagination = document.getElementById('pagination');
            const totalPages = Math.ceil(filteredItems.length / itemsPerPage);

            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let html = `
                <button ${currentPage === 1 ? 'disabled' : ''} data-page="${currentPage - 1}">Previous</button>
            `;

            for (let i = 1; i <= totalPages; i++) {
                html += `<button class="${currentPage === i ? 'active' : ''}" data-page="${i}">${i}</button>`;
            }

            html += `
                <button ${currentPage === totalPages ? 'disabled' : ''} data-page="${currentPage + 1}">Next</button>
            `;

            pagination.innerHTML = html;
        }

        // Attach Item Event Listeners
        function attachItemEventListeners() {
            // Quantity type toggles
            document.querySelectorAll('.quantity-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const card = this.closest('.item-card');
                    card.querySelectorAll('.quantity-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    
                    // Update price display
                    const itemId = parseInt(card.dataset.itemId);
                    const item = items.find(i => i.id === itemId);
                    const isStack = this.dataset.quantityType === 'stack';
                    const price = isStack 
                        ? (currentCity === 'Madrid' ? item.price_madrid_single : item.price_barcelona_single) * 64
                        : (currentCity === 'Madrid' ? item.price_madrid_single : item.price_barcelona_single);
                    
                    const priceElement = card.querySelector('.item-price .price');
                    priceElement.textContent = `€${price.toFixed(2)}`;
                    
                    const perItemElement = card.querySelector('.item-price .per-item');
                    if (isStack) {
                        if (!perItemElement) {
                            const perItem = document.createElement('div');
                            perItem.className = 'per-item';
                            card.querySelector('.item-price').appendChild(perItem);
                        }
                        card.querySelector('.per-item').textContent = `€${(price / 64).toFixed(2)} per item`;
                    } else {
                        if (perItemElement) {
                            perItemElement.remove();
                        }
                    }
                });
            });

            // Add to cart buttons
            document.querySelectorAll('.add-to-cart-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const card = this.closest('.item-card');
                    const itemId = parseInt(this.dataset.itemId);
                    const item = items.find(i => i.id === itemId);
                    const isStack = card.querySelector('.quantity-btn[data-quantity-type="stack"]').classList.contains('active');
                    const quantity = parseInt(card.querySelector('.quantity-input').value) || 1;
                    
                    addToCart(item, quantity, isStack);
                });
            });
        }

        // Update Items Count
        function updateItemsCount() {
            document.getElementById('items-count').textContent = filteredItems.length;
        }

        // Cart Functions
        function addToCart(item, quantity, isStack) {
            const existingItem = cart.find(cartItem => 
                cartItem.item.id === item.id && cartItem.isStack === isStack
            );

            if (existingItem) {
                existingItem.quantity += quantity;
            } else {
                cart.push({ item, quantity, isStack });
            }

            updateCartCount();
            updateCartDisplay();
        }

        function removeFromCart(itemId) {
            cart = cart.filter(cartItem => cartItem.item.id !== itemId);
            updateCartCount();
            updateCartDisplay();
        }

        function clearCart() {
            cart = [];
            updateCartCount();
            updateCartDisplay();
        }

        function updateCartCount() {
            document.getElementById('cart-count').textContent = cart.length;
        }

        function getCartTotals() {
            const subtotal = cart.reduce((total, cartItem) => {
                const basePrice = currentCity === 'Madrid' 
                    ? cartItem.item.price_madrid_single 
                    : cartItem.item.price_barcelona_single;
                const price = cartItem.isStack ? basePrice * 64 : basePrice;
                return total + price * cartItem.quantity;
            }, 0);

            const taxRate = currentCity === 'Madrid' ? 0.05 : 0.10;
            const tax = subtotal * taxRate;
            const total = subtotal + tax;

            return {
                subtotal: Math.round(subtotal * 100) / 100,
                tax: Math.round(tax * 100) / 100,
                total: Math.round(total * 100) / 100
            };
        }

        function updateCartDisplay() {
            const cartItems = document.getElementById('cart-items');
            const cartFooter = document.getElementById('cart-footer');

            if (cart.length === 0) {
                cartItems.innerHTML = `
                    <div class="cart-empty">
                        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="9" cy="21" r="1"></circle>
                            <circle cx="20" cy="21" r="1"></circle>
                            <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
                        </svg>
                        <p>Your cart is empty</p>
                    </div>
                `;
                cartFooter.innerHTML = '';
                return;
            }

            const totals = getCartTotals();

            cartItems.innerHTML = cart.map(cartItem => {
                const basePrice = currentCity === 'Madrid' 
                    ? cartItem.item.price_madrid_single 
                    : cartItem.item.price_barcelona_single;
                const price = cartItem.isStack ? basePrice * 64 : basePrice;
                const lineTotal = price * cartItem.quantity;

                return `
                    <div class="cart-item">
                        <div class="cart-item-info">
                            <h3>${cartItem.item.name}</h3>
                            <p>${cartItem.quantity}x ${cartItem.isStack ? 'Stack' : 'Single'}</p>
                            <p class="price">€${price.toFixed(2)} each</p>
                        </div>
                        <div class="cart-item-actions">
                            <div class="total">€${lineTotal.toFixed(2)}</div>
                            <button class="remove-btn" data-item-id="${cartItem.item.id}">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <polyline points="3 6 5 6 21 6"></polyline>
                                    <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                                </svg>
                                Remove
                            </button>
                        </div>
                    </div>
                `;
            }).join('');

            // Add remove button listeners
            cartItems.querySelectorAll('.remove-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    removeFromCart(parseInt(this.dataset.itemId));
                });
            });

            cartFooter.innerHTML = `
                <div class="cart-totals">
                    <div class="row">
                        <span>Subtotal (No Tax)</span>
                        <span>€${totals.subtotal.toFixed(2)}</span>
                    </div>
                    <div class="row">
                        <span>${currentCity} Tax (${currentCity === 'Madrid' ? '5%' : '10%'})</span>
                        <span>€${totals.tax.toFixed(2)}</span>
                    </div>
                    <div class="row total">
                        <span>Total Due</span>
                        <span class="amount">€${totals.total.toFixed(2)}</span>
                    </div>
                </div>
                <div class="cart-actions">
                    <button class="copy-receipt-btn" id="copy-receipt">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                        <span>Copy Order Receipt</span>
                    </button>
                    <button class="clear-cart-btn" id="clear-cart">Clear Cart</button>
                </div>
            `;

            // Add cart action listeners
            document.getElementById('copy-receipt').addEventListener('click', copyReceipt);
            document.getElementById('clear-cart').addEventListener('click', clearCart);
        }

        function copyReceipt() {
            const totals = getCartTotals();
            const taxRate = currentCity === 'Madrid' ? '5%' : '10%';
            
            let receipt = `==================================\n`;
            receipt += `   MINECRAFT STORE RECEIPT\n`;
            receipt += `==================================\n`;
            receipt += `City Selected: ${currentCity}\n`;
            receipt += `----------------------------------\n`;
            receipt += `ITEMS PURCHASED:\n`;
            
            cart.forEach(cartItem => {
                const basePrice = currentCity === 'Madrid' 
                    ? cartItem.item.price_madrid_single 
                    : cartItem.item.price_barcelona_single;
                const price = cartItem.isStack ? basePrice * 64 : basePrice;
                const lineTotal = price * cartItem.quantity;
                const quantityType = cartItem.isStack ? 'Stack' : 'Single';
                
                receipt += `- ${cartItem.quantity}x ${quantityType} ${cartItem.item.name} (€${lineTotal.toFixed(2)})\n`;
            });
            
            receipt += `----------------------------------\n`;
            receipt += `Subtotal (No Tax):  €${totals.subtotal.toFixed(2)}\n`;
            receipt += `${currentCity} Tax (${taxRate}): €${totals.tax.toFixed(2)}\n`;
            receipt += `==================================\n`;
            receipt += `FINAL TOTAL DUE:    €${totals.total.toFixed(2)}\n`;
            receipt += `==================================\n`;
            receipt += `(Tax of €${totals.tax.toFixed(2)} paid to ${currentCity} Mayor Treasury)\n`;
            
            navigator.clipboard.writeText(receipt).then(() => {
                const btn = document.getElementById('copy-receipt');
                const originalText = btn.querySelector('span').textContent;
                btn.querySelector('span').textContent = 'Copied!';
                setTimeout(() => {
                    btn.querySelector('span').textContent = originalText;
                }, 2000);
            });
        }

        // Setup Event Listeners
        function setupEventListeners() {
            // Navigation tabs
            document.querySelectorAll('.nav-tab').forEach(tab => {
                tab.addEventListener('click', function() {
                    showPage(this.dataset.page);
                });
            });

            // City toggle
            document.querySelectorAll('.city-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    setCity(this.dataset.city);
                });
            });

            // Search input
            document.getElementById('search-input').addEventListener('input', function() {
                searchQuery = this.value;
                filterItems();
                renderItems();
                updateItemsCount();
            });

            // Category filters
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.category-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    selectedCategory = this.dataset.category;
                    filterItems();
                    renderItems();
                    updateItemsCount();
                });
            });

            // Pagination
            document.getElementById('pagination').addEventListener('click', function(e) {
                if (e.target.tagName === 'BUTTON' && !e.target.disabled) {
                    currentPage = parseInt(e.target.dataset.page);
                    renderItems();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                }
            });

            // Cart button
            document.getElementById('cart-button').addEventListener('click', function() {
                document.getElementById('cart-modal').classList.add('active');
            });

            // Close cart
            document.getElementById('close-cart').addEventListener('click', function() {
                document.getElementById('cart-modal').classList.remove('active');
            });

            document.getElementById('cart-overlay').addEventListener('click', function() {
                document.getElementById('cart-modal').classList.remove('active');
            });
        }

        // Initialize the application
        document.addEventListener('DOMContentLoaded', () => {
            loadItems();
            renderJobs();
            setupEventListeners();
            updateCartCount();
        });
    </script>
</body>
</html>
