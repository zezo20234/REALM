<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0e1120">
<title>TapPay</title>
<style>
:root{--bg:#0e1120;--card:#171b30;--card2:#1e2340;--line:#2a3157;--text:#eef0ff;--mut:#8e95b8;--acc:#6c7bff;--ok:#2ecc8f;--bad:#ff5d73;--warn:#ffb84d}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
body{min-height:100vh}
h1,h2,h3{margin:0 0 12px}
.mut{color:var(--mut)}
.ok{color:var(--ok)}.bad{color:var(--bad)}.warn{color:var(--warn)}
input,select,textarea{width:100%;background:#0e1226;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:11px 12px;font:inherit;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--acc)}
label{display:block;margin:0 0 12px;color:var(--mut);font-size:13px}
label input,label select,label textarea{margin-top:5px;color:var(--text);font-size:15px}
label.chk{display:flex;gap:8px;align-items:center;color:var(--text)}
label.chk input{width:auto;margin:0}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 16px;font:inherit;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.1)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--text)}
.btn.ok{background:var(--ok);color:#06241a}
.btn.bad{background:var(--bad)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.btn.big{width:100%;padding:16px;font-size:17px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:16px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat b{display:block;font-size:22px;margin-top:4px}
.tbl{overflow:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:500;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--card2)}
.pill.ok{background:#12372c;color:var(--ok)}.pill.bad{background:#40202a;color:var(--bad)}
/* landing */
.landing{max-width:760px;margin:0 auto;padding:40px 18px}
.landing a{display:block;text-decoration:none;color:inherit}
.choice{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:26px;margin-bottom:16px}
.choice:hover{border-color:var(--acc)}
.choice .ico{font-size:34px}
/* admin shell */
.top{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;border-bottom:1px solid var(--line);background:#0b0e1c;position:sticky;top:0;z-index:5}
.brand{font-weight:800;font-size:18px}
.shell{display:grid;grid-template-columns:210px 1fr;min-height:calc(100vh - 54px)}
.side{border-right:1px solid var(--line);padding:12px;background:#0b0e1c}
.side button{display:block;width:100%;text-align:left;background:none;border:0;color:var(--mut);padding:10px 12px;border-radius:10px;font:inherit;cursor:pointer;margin-bottom:2px}
.side button.on,.side button:hover{background:var(--card2);color:var(--text)}
.main{padding:20px;max-width:1000px;width:100%}
@media(max-width:760px){.shell{grid-template-columns:1fr}.side{display:flex;overflow:auto;border-right:0;border-bottom:1px solid var(--line)}.side button{white-space:nowrap;width:auto}.grid2{grid-template-columns:1fr}.main{padding:14px}}
/* mobile app */
.me{max-width:520px;margin:0 auto;padding:0 14px 90px}
.meTop{display:flex;justify-content:space-between;align-items:center;padding:14px 0}
.bal{background:linear-gradient(135deg,#5b6bff,#8a4dff);border-radius:20px;padding:22px;margin-bottom:16px}
.bal small{opacity:.8}.bal b{display:block;font-size:30px;margin:4px 0 10px}
.nav{position:fixed;bottom:0;left:0;right:0;background:#0b0e1c;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.nav div{display:flex;max-width:520px;width:100%}
.nav button{flex:1;background:none;border:0;color:var(--mut);padding:9px 0 8px;font:inherit;font-size:11px;cursor:pointer}
.nav button span{display:block;font-size:20px}
.nav button.on{color:var(--text)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.post{padding:14px 0;border-bottom:1px solid var(--line)}
.post .av{width:36px;height:36px;border-radius:50%;background:var(--acc);display:grid;place-items:center;font-weight:700;flex:none}
.post img{max-width:100%;border-radius:12px;margin-top:8px}
.meter{height:8px;background:#0e1226;border-radius:9px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;background:var(--ok);transition:width .5s}
.pk{border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
dialog{background:var(--card);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:20px;width:min(380px,92vw)}
dialog::backdrop{background:#000a}
dialog .row{flex-direction:row-reverse}
#toast{position:fixed;left:50%;bottom:80px;transform:translateX(-50%);z-index:50;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none}
#toast div{background:#0b0e1c;border:1px solid var(--line);padding:10px 16px;border-radius:12px}
#toast div.bad{border-color:var(--bad)}#toast div.ok{border-color:var(--ok)}
.big-ok{text-align:center;padding:24px}.big-ok .tick{font-size:56px}
.seg{display:flex;gap:8px;margin-bottom:14px}.seg .btn{flex:1}
.pulse{animation:p 1.2s infinite}@keyframes p{50%{opacity:.4}}
</style>
</head>
<body>
<div id="root"></div>
<dialog id="dlg"></dialog>
<div id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getDatabase, ref, get, set, update, push, remove, onValue, runTransaction, query, limitToLast, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyDclp6rqCZRVreOzTcxv840mXcl6nDKAv8",
  authDomain: "pack-f76c3.firebaseapp.com",
  databaseURL: "https://pack-f76c3-default-rtdb.firebaseio.com",
  projectId: "pack-f76c3",
  storageBucket: "pack-f76c3.firebasestorage.app",
  messagingSenderId: "694325056042",
  appId: "1:694325056042:web:aae383919a2ce159892953"
};
const fb = initializeApp(firebaseConfig);
const db = getDatabase(fb);

/* ---------- settings ---------- */
const CUR = 'SAR';
const LINE_PRICE = 20;
const PACKS = [
  { id: 'mini', name: 'Mini', mb: 300,  price: 10 },
  { id: 'plus', name: 'Plus', mb: 1000, price: 25 },
  { id: 'max',  name: 'Max',  mb: 3000, price: 60 }
];

/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const root = $('#root');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const r2 = n => Math.round(n * 100) / 100;
const billVisible = b => !b.showAt || b.showAt <= Date.now();
const money = n => (Number(n) || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 }) + ' ' + CUR;
const when = t => t ? new Date(t).toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' }) : '';
function toast(m, k = 'ok') {
  const d = document.createElement('div'); d.className = k; d.textContent = m;
  $('#toast').appendChild(d); setTimeout(() => d.remove(), 3200);
}
function ask(title, fields, okLabel = 'OK') {
  return new Promise(res => {
    const d = $('#dlg');
    d.innerHTML = `<form method="dialog"><h3>${esc(title)}</h3>${fields.map(f =>
      `<label>${esc(f.label)}<input name="${f.name}" type="${f.type || 'text'}" value="${esc(f.value ?? '')}" ${f.attrs || ''}></label>`).join('')}
      <div class="row"><button class="btn" value="ok">${esc(okLabel)}</button><button class="btn ghost" value="x" formnovalidate>Cancel</button></div></form>`;
    d.onclose = () => {
      if (d.returnValue === 'ok') { const o = {}; new FormData(d.querySelector('form')).forEach((v, k) => o[k] = v); res(o); }
      else res(null);
    };
    d.returnValue = '';
    d.showModal();
  });
}
const subs = [];
const listen = (r, cb) => { subs.push(onValue(r, cb)); };
let billTick = null;
function cleanup() { while (subs.length) subs.pop()(); stopMeter(); scanHandler = null; clearInterval(billTick); }

/* ---------- money core ---------- */
async function debit(id, amt, desc, type, extra = {}) {
  amt = Number(amt);
  if (!(amt > 0)) return { ok: false, msg: 'Invalid amount' };
  let msg = '';
  const res = await runTransaction(ref(db, 'accounts/' + id), a => {
    if (a === null) return a;
    if ((a.balance || 0) < amt) { msg = 'Insufficient balance'; return; }
    a.balance = r2((a.balance || 0) - amt);
    return a;
  });
  if (!res.committed || !res.snapshot.exists()) return { ok: false, msg: msg || 'Account not found' };
  const bal = res.snapshot.val().balance;
  await push(ref(db, 'tx/' + id), { type, amount: -amt, desc, balanceAfter: bal, ts: serverTimestamp(), ...extra });
  return { ok: true, balance: bal };
}
async function credit(id, amt, desc, type, extra = {}) {
  amt = Number(amt);
  if (!(amt > 0)) return { ok: false, msg: 'Invalid amount' };
  const res = await runTransaction(ref(db, 'accounts/' + id), a => {
    if (a === null) return a;
    a.balance = r2((a.balance || 0) + amt);
    return a;
  });
  if (!res.committed || !res.snapshot.exists()) return { ok: false, msg: 'Account not found' };
  const bal = res.snapshot.val().balance;
  await push(ref(db, 'tx/' + id), { type, amount: amt, desc, balanceAfter: bal, ts: serverTimestamp(), ...extra });
  return { ok: true, balance: bal };
}
async function accIdByUid(uid) { const s = await get(ref(db, 'cards/' + uid)); return s.exists() ? s.val() : null; }
async function getAcc(id) { const s = await get(ref(db, 'accounts/' + id)); return s.exists() ? { id, ...s.val() } : null; }
async function accIdByName(n) {
  n = String(n || '').trim().toLowerCase();
  if (!/^[a-z0-9_]{1,16}$/.test(n)) return null;
  const s = await get(ref(db, 'usernames/' + n)); return s.exists() ? s.val() : null;
}
// one place that creates accounts (cashier or the user on mobile): username + PIN + card UID
async function createAccount({ name, uid, balance = 0 }) {
  name = String(name || '').trim();
  if (!/^[A-Za-z0-9_]{3,16}$/.test(name)) return { ok: false, msg: 'Username: 3–16 letters, numbers or _' };
  uid = cleanUid(uid);
  if (!uid) return { ok: false, msg: 'Tap a card first' };
  if (await accIdByUid(uid)) return { ok: false, msg: 'This card is already registered' };
  const u = name.toLowerCase();
  let id; do { id = String(Math.floor(100000 + Math.random() * 900000)); } while ((await get(ref(db, 'accounts/' + id))).exists());
  const un = await runTransaction(ref(db, 'usernames/' + u), c => c ? undefined : id);
  if (!un.committed) return { ok: false, msg: 'Username already taken' };
  const cc = await runTransaction(ref(db, 'cards/' + uid), c => c ? undefined : id);
  if (!cc.committed) { await remove(ref(db, 'usernames/' + u)); return { ok: false, msg: 'This card is already registered' }; }
  await set(ref(db, 'accounts/' + id), { name, uid, balance: r2(balance), created: Date.now() });
  if (balance > 0) await push(ref(db, 'tx/' + id), { type: 'topup', amount: r2(balance), desc: 'Opening balance', balanceAfter: r2(balance), ts: serverTimestamp() });
  return { ok: true, id };
}

/* ---------- card reader feed ---------- */
let scanHandler = null, firstScan = true, lastN = null;
const cleanUid = u => String(u || '').toUpperCase().replace(/[^0-9A-F]/g, '');
function pushScan(uid, device = 'web') {
  uid = cleanUid(uid);
  if (!uid) return toast('Invalid UID', 'bad');
  return set(ref(db, 'scans/latest'), { uid, n: Math.random().toString(36).slice(2), device, ts: serverTimestamp() });
}
onValue(ref(db, 'scans/latest'), s => {
  const v = s.val();
  if (firstScan) { firstScan = false; lastN = v?.n; showReader(v); return; }
  if (!v || v.n === lastN) return;
  lastN = v.n; showReader(v);
  runScan(v.uid);
});
// one scan at a time: a duplicate tap while we're still looking up the card is ignored,
// so the screen is never re-drawn under the cashier's/customer's fingers
let scanBusy = false;
async function runScan(uid) {
  if (!scanHandler || scanBusy) return;
  scanBusy = true;
  try { await scanHandler(uid); } catch (e) { console.error(e); } finally { scanBusy = false; }
}
// re-render safely: remember which field has focus (and what was typed) and put it back
function keep(fn) {
  const a = document.activeElement;
  const id = a && a.id, tag = a && a.tagName;
  const typing = id && (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT');
  const val = typing ? a.value : null;
  const s = typing && a.selectionStart != null ? [a.selectionStart, a.selectionEnd] : null;
  fn();
  if (typing) {
    const n = document.getElementById(id);
    if (n && n !== a) {
      if (n.type !== 'file') n.value = val;
      n.focus();
      if (s) { try { n.setSelectionRange(s[0], s[1]); } catch (e) { } }
    }
  }
}
// Enter key submits the PIN / login forms
document.addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  const m = {}[e.target.id];
  if (m) { e.preventDefault(); ACT[m]({}, e.target); }
});
function showReader(v) {
  const el = $('#rdr'); if (!el || !v) return;
  el.innerHTML = `Last tap: <b>${esc(v.uid)}</b> · ${esc(v.device || '?')} · ${when(v.ts)}`;
}

/* ---------- USB reader: Arduino Uno over Web Serial (cashier laptop) ---------- */
const SER = { port: null, reader: null, status: 'off', busy: false };
function serStatus(st) {
  SER.status = st;
  const b = $('#serBadge');
  if (b) { b.className = 'pill ' + (st === 'on' ? 'ok' : 'bad'); b.textContent = st === 'on' ? '🔌 Reader connected' : st === 'busy' ? '🔌 Connecting…' : '🔌 Reader not paired'; }
  const btn = $('#serBtn'); if (btn) btn.textContent = st === 'on' ? 'Disconnect' : 'Pair reader';
  const r2el = $('#serInfo'); if (r2el) r2el.textContent = st === 'on' ? 'Connected — taps on the reader are sent to the system.' : 'Not connected. Plug in the Arduino Uno and press Pair reader (first time only).';
}
async function serOpen(port) {
  if (SER.busy || SER.status === 'on') return;
  SER.busy = true; serStatus('busy');
  try {
    await port.open({ baudRate: 9600 });
    SER.port = port; serStatus('on');
    const dec = new TextDecoderStream();
    const closed = port.readable.pipeTo(dec.writable).catch(() => { });
    const rd = dec.readable.getReader(); SER.reader = rd;
    let buf = '';
    (async () => {
      try {
        for (;;) {
          const { value, done } = await rd.read(); if (done) break;
          buf += value; let i;
          while ((i = buf.indexOf('\n')) >= 0) {
            const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
            if (line.startsWith('UID:')) pushScan(line.slice(4), 'usb');
          }
        }
      } catch (e) { }
      try { rd.releaseLock(); } catch (e) { }
      await closed;
      try { await port.close(); } catch (e) { }
      SER.port = null; SER.reader = null; serStatus('off');
    })();
  } catch (e) {
    serStatus('off');
    toast('Could not open the reader. Close the Arduino IDE Serial Monitor and try again.', 'bad');
  } finally { SER.busy = false; }
}
async function serPair() {
  if (!('serial' in navigator)) return toast('USB pairing needs desktop Chrome or Edge, opened over https or localhost', 'bad');
  if (SER.status === 'on') { SER.reader?.cancel(); return; }
  try { serOpen(await navigator.serial.requestPort()); } catch (e) { /* user closed the picker */ }
}
async function serAuto() {
  if (!('serial' in navigator)) return;
  try { const ports = await navigator.serial.getPorts(); if (ports.length) serOpen(ports[0]); } catch (e) { }
}
if ('serial' in navigator) {
  navigator.serial.addEventListener('connect', e => {
    if (sessionStorage.tp_admin === '1' && location.hash === '#admin') serOpen(e.target);
  });
}

/* ---------- router ---------- */
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b && ACT[b.dataset.act]) ACT[b.dataset.act](b.dataset, b);
});
document.addEventListener('input', e => {
  if (e.target.id === 'aq') V.accounts.draw();
  if (e.target.id === 'tq') V.tx.draw();
});
window.addEventListener('hashchange', route);
function route() {
  cleanup();
  const h = location.hash;
  if (h === '#admin') return adminGate();
  if (h === '#me') return meStart();
  landing();
}
function landing() {
  root.innerHTML = `<div class="landing"><h1 style="font-size:34px">💳 TapPay</h1><p class="mut">Card payments with your RFID RC522 reader.</p>
  <a href="#admin"><div class="choice"><div class="ico">🖥️</div><h2>Cashier / Admin</h2><p class="mut">Laptop: create accounts, charge payments, bills, reader.</p></div></a>
  <a href="#me"><div class="choice"><div class="ico">📱</div><h2>My account</h2><p class="mut">Mobile: balance, bills, phone line, packages, Instazyad.</p></div></a></div>`;
}

/* =====================================================
   ADMIN
   ===================================================== */
const D = { acc: {}, bills: {}, tx: {} };
const allTx = () => Object.entries(D.tx).flatMap(([acc, o]) => Object.entries(o || {}).map(([id, t]) => ({ id, acc, ...t }))).sort((a, b) => (b.ts || 0) - (a.ts || 0));
const accName = id => D.acc[id]?.name || id;
let curTab = 'dash';

function adminGate() { sessionStorage.tp_admin = '1'; adminApp(); }
const TABS = [['dash', '📊 Dashboard'], ['pos', '💳 Charge'], ['new', '➕ New account'], ['accounts', '👥 Accounts'], ['bills', '🧾 Bills'], ['tx', '📜 Transactions'], ['reader', '📡 Reader']];
function adminApp() {
  cleanup();
  root.innerHTML = `<div class="top"><div class="brand">💳 TapPay · Cashier</div><div class="row"><span class="pill bad" id="serBadge"></span><button class="btn ghost sm" id="serBtn" data-act="serPair">Pair reader</button><span class="mut" id="rdr" style="font-size:12px"></span><button class="btn ghost sm" data-act="alogout">Logout</button></div></div>
  <div class="shell"><div class="side">${TABS.map(([k, n]) => `<button data-act="tab" data-k="${k}" id="t_${k}">${n}</button>`).join('')}</div><div class="main" id="view"></div></div>`;
  listen(ref(db, 'accounts'), s => { D.acc = s.val() || {}; drawCur(); });
  listen(ref(db, 'bills'), s => { D.bills = s.val() || {}; drawCur(); });
  listen(ref(db, 'tx'), s => { D.tx = s.val() || {}; drawCur(); });
  get(ref(db, 'scans/latest')).then(s => showReader(s.val()));
  serStatus(SER.status); serAuto();
  showTab(curTab);
}
function drawCur() { keep(() => V[curTab]?.draw?.()); }
function showTab(k) {
  curTab = k; scanHandler = null;
  document.querySelectorAll('.side button').forEach(b => b.classList.toggle('on', b.id === 't_' + k));
  $('#view').innerHTML = V[k].html();
  V[k].init?.(); V[k].draw?.();
}

const V = {};
/* --- dashboard --- */
V.dash = {
  html: () => `<h2>Dashboard</h2><div class="stats" id="stats"></div><div class="card"><h3>Latest transactions</h3><div class="tbl" id="dTx"></div></div>`,
  draw() {
    const accs = Object.values(D.acc), tx = allTx();
    const today = new Date().toDateString();
    const sales = tx.filter(t => t.type === 'pos' || t.type === 'bill').filter(t => new Date(t.ts || 0).toDateString() === today).reduce((s, t) => s - t.amount, 0);
    const unpaid = Object.values(D.bills).flatMap(o => Object.values(o || {})).filter(b => b.status !== 'paid').length;
    $('#stats').innerHTML = [['Accounts', accs.length], ['Total balance', money(accs.reduce((s, a) => s + (a.balance || 0), 0))], ['Sales today', money(sales)], ['Unpaid bills', unpaid]]
      .map(([a, b]) => `<div class="stat"><span class="mut">${a}</span><b>${b}</b></div>`).join('');
    $('#dTx').innerHTML = txTable(tx.slice(0, 10));
  }
};
function txTable(list) {
  if (!list.length) return '<p class="mut">Nothing yet.</p>';
  return `<table><thead><tr><th>Time</th><th>Account</th><th>Type</th><th>Description</th><th>Amount</th><th>Balance</th></tr></thead><tbody>${list.map(t =>
    `<tr><td>${when(t.ts)}</td><td>${esc(accName(t.acc))}</td><td><span class="pill">${esc(t.type)}</span></td><td>${esc(t.desc)}</td><td class="${t.amount < 0 ? 'bad' : 'ok'}">${t.amount < 0 ? '−' : '+'}${money(Math.abs(t.amount))}</td><td>${money(t.balanceAfter)}</td></tr>`).join('')}</tbody></table>`;
}

/* --- POS / charge --- */
let pos = { amount: 0, desc: '', need: false, to: '', acc: null, verified: false };
V.pos = {
  html: () => `<h2>Charge a payment</h2>
  <div class="card"><div class="grid2"><label>Amount (${CUR})<input id="pAmt" type="number" step="0.01" min="0" value="${pos.amount || ''}"></label>
  <label>Description<input id="pDesc" placeholder="e.g. Snacks" value="${esc(pos.desc)}"></label></div>
  <label>Pay to (who receives the money)<select id="pTo"></select></label>
  <div class="row"><button class="btn" data-act="posStart">Start — wait for card tap</button>

  <p id="pStatus" class="mut"></p></div><div id="pPanel"></div>`,
  init() { V.pos.fill(); if (pos.acc) V.pos.panel(); },
  fill() {
    const sel = $('#pTo'); if (!sel) return;
    const cur = sel.value || pos.to || '';
    sel.innerHTML = `<option value="">Shop / cashier (no account)</option>` +
      Object.entries(D.acc).map(([id, a]) => `<option value="${id}">${esc(a.name)} (${id})</option>`).join('');
    sel.value = D.acc[cur] ? cur : '';
    pos.to = sel.value;
  },
  draw() { V.pos.fill(); if (pos.acc && pos.verified && $('#pPanel')) V.pos.panel(); },
  panel() {
    const a = pos.acc; if (!a) { $('#pPanel').innerHTML = ''; return; }

    $('#pPanel').innerHTML = `<div class="card"><div class="row between"><div><h3 style="margin:0">${esc(a.name)}</h3><span class="mut">Card ${esc(a.uid)}</span></div><div style="text-align:right"><span class="mut">Balance</span><br><b style="font-size:22px">${money(a.balance)}</b></div></div><hr style="border:0;border-top:1px solid var(--line);margin:14px 0">

    <p><button class="btn ghost sm" data-act="posReset">Cancel / next customer</button></p></div>`;

    const blob = new Blob([rows.map(r => r.map(c => '"' + String(c ?? '').replace(/"/g, '""') + '"').join(',')).join('\n')], { type: 'text/csv' });

  },
  /* reader */
  simScan() { pushScan($('#sUid').value, 'simulated'); },
  serPair() { serPair(); },

  /* ---------- mobile actions ---------- */
  mlogout() { localStorage.removeItem('tp_me'); location.hash = ''; route(); },
  mtab(d) { meShow(d.k); },
  lmode(d) { scanHandler = null; meLogin(d.m); },
  mtap() {
    const st = $('#lStat'); if (st) st.innerHTML = '<span class="pulse">📡 Waiting for your card…</span>';
    scanHandler = async uid => {
      const id = await accIdByUid(uid); if (!id) return toast('Card not registered', 'bad');
      localStorage.tp_me = JSON.stringify({ id }); meStart();
    };
  },
  async msignup() {
    const name = $('#uUser').value.trim();
    if (!/^[A-Za-z0-9_]{3,16}$/.test(name)) return toast('Username: 3–16 letters, numbers or _', 'bad');
    if (await accIdByName(name)) return toast('Username already taken', 'bad');
    $('#uStat').innerHTML = '<span class="pulse">📡 Now tap your card on the cashier\'s reader…</span><br><button class="btn ghost sm" style="margin-top:10px" data-act="lmode" data-m="up">Cancel</button>';
    scanHandler = async uid => {
      if (await accIdByUid(uid)) return toast('That card already has an account', 'bad');
      scanHandler = null;
      const r = await createAccount({ name, uid, balance: 0 });
      if (!r.ok) { toast(r.msg, 'bad'); return meLogin('up'); }
      localStorage.tp_me = JSON.stringify({ id: r.id }); meStart();
    };
  },
  async mpay(d) {
    const b = M.bills[d.id]; if (!b || b.status === 'paid') return;
    const r = await debit(M.id, b.amount, 'Bill: ' + b.title, 'bill');
    if (!r.ok) return toast(r.msg, 'bad');
    await update(ref(db, `bills/${M.id}/${d.id}`), { status: 'paid', paidAt: Date.now() }); toast('Bill paid ✅');
  },
  async mbuyline(d) {
    const num = d.num;
    const claim = await runTransaction(ref(db, 'lines/' + num), c => c ? undefined : M.id);
    if (!claim.committed) return toast('That number was just taken', 'bad');
    const r = await debit(M.id, LINE_PRICE, 'New line ' + num, 'line');
    if (!r.ok) { await remove(ref(db, 'lines/' + num)); return toast(r.msg, 'bad'); }
    await update(ref(db, `accounts/${M.id}/line`), { number: num, dataMB: 0, since: Date.now() });
    toast('Line activated 🎉');
  },
  mnums() { M.nums = genNums(); meShow('phone'); },
  async mbuypack(d) {
    const p = PACKS.find(x => x.id === d.id); let msg = '';
    const res = await runTransaction(ref(db, 'accounts/' + M.id), a => {
      if (!a) return a;
      if (!a.line) { msg = 'Buy a line first'; return; }
      if ((a.balance || 0) < p.price) { msg = 'Insufficient balance'; return; }
      a.balance = r2(a.balance - p.price); a.line.dataMB = (a.line.dataMB || 0) + p.mb; return a;
    });
    if (!res.committed) return toast(msg || 'Failed', 'bad');
    await push(ref(db, 'tx/' + M.id), { type: 'package', amount: -p.price, desc: `${p.name} package ${p.mb} MB`, balanceAfter: res.snapshot.val().balance, ts: serverTimestamp() });
    toast(`+${p.mb} MB added`);
  },
  async msend() {
    const toName = $('#sTo').value.trim(), amt = Number($('#sAmt').value);
    const to = await accIdByName(toName); if (!to) return toast('Username not found', 'bad');
    if (to === M.id) return toast("You can't send to yourself", 'bad');
    const t = await getAcc(to);
    const r = await debit(M.id, amt, 'Sent to ' + t.name, 'transfer-out'); if (!r.ok) return toast(r.msg, 'bad');
    await credit(to, amt, 'From ' + M.acc.name, 'transfer-in');
    $('#sAmt').value = ''; toast('Sent ✅');
  },
  async mpost() {
    const text = $('#pText').value.trim(); if (!text && !M.img) return toast('Write something first', 'bad');
    await push(ref(db, 'posts'), { acc: M.id, name: M.acc.name, text, img: M.img || null, ts: serverTimestamp() });
    $('#pText').value = ''; M.img = null; $('#pPrev').innerHTML = '';
  },
  async mlike(d) {
    const p = M.posts[d.id]; if (!p) return;
    await set(ref(db, `posts/${d.id}/likes/${M.id}`), p.likes?.[M.id] ? null : true);
  },
  async mdelpost(d) { if (confirm('Delete your post?')) await remove(ref(db, 'posts/' + d.id)); }
};

/* =====================================================
   MOBILE (user portal)
   ===================================================== */
const M = { id: null, acc: null, bills: {}, tx: {}, posts: {}, nums: null, img: null, iState: '' };
const ME_TABS = [['home', '🏠', 'Home'], ['bills', '🧾', 'Bills'], ['insta', '📸', 'Instazyad'], ['phone', '📱', 'Phone'], ['send', '💸', 'Send'], ['hist', '🕘', 'History']];
let meCur = 'home';
const genNums = () => Array.from({ length: 3 }, () => '010' + String(Math.floor(Math.random() * 1e8)).padStart(8, '0'));

function meStart() {
  cleanup();
  let saved = null; try { saved = JSON.parse(localStorage.tp_me || 'null'); } catch (e) { }
  if (!saved) return meLogin();
  M.id = saved.id; M.acc = null;
  root.innerHTML = `<div class="me"><div class="meTop"><b style="font-size:18px">💳 TapPay</b><button class="btn ghost sm" data-act="mlogout">Logout</button></div><div id="mv"><p class="mut">Loading…</p></div></div>`;
  let shell = false;
  const meRefresh = () => keep(() => { const t = ME[meCur]; if (t && t.refresh) t.refresh(); });
  listen(ref(db, 'accounts/' + M.id), s => {
    const a = s.val();
    if (!a) { toast('Session ended — please log in', 'bad'); return ACT.mlogout(); }
    M.acc = { id: M.id, ...a };
    if (!shell) { shell = true; meShell(); }
    $('#mBal') && ($('#mBal').textContent = money(a.balance));
    meRefresh();
  });
  listen(ref(db, 'bills/' + M.id), s => { M.bills = s.val() || {}; meRefresh(); });
  listen(ref(db, 'tx/' + M.id), s => { M.tx = s.val() || {}; meRefresh(); });
  listen(query(ref(db, 'posts'), limitToLast(50)), s => { M.posts = s.val() || {}; if (meCur === 'insta') ME.insta.feed(); });
  // bills appear live (also scheduled ones when their time comes)
  let seen = null;
  billTick = setInterval(() => {
    const n = Object.values(M.bills).filter(b => b.status !== 'paid' && billVisible(b)).length;
    if (seen !== null && n > seen) toast('🧾 New bill');
    if (seen !== n) meRefresh();
    seen = n;
  }, 3000);
}
function meLogin(mode = 'in') {
  root.innerHTML = `<div class="me" style="padding-top:40px"><h1>💳 TapPay</h1>
  <div class="seg"><button class="btn ${mode === 'in' ? '' : 'ghost'}" data-act="lmode" data-m="in">Log in</button><button class="btn ${mode === 'up' ? '' : 'ghost'}" data-act="lmode" data-m="up">Create account</button></div>
  <div class="card">${mode === 'in' ? `
    <div class="big-ok"><div class="tick">📡</div><h3>Tap your card</h3><p class="mut">Tap your card on the reader to log in.</p><p id="lStat" class="mut"><span class="pulse">Waiting for your card…</span></p><button class="btn ghost" data-act="mtap">Try again</button></div>` : `
    <label>Choose a username<input id="uUser" autocapitalize="none" maxlength="16" placeholder="3–16 letters, numbers or _"></label>
    <button class="btn big" data-act="msignup">Create &amp; tap my card</button>
    <p class="mut" style="font-size:13px">You'll tap your card on the cashier's reader. Your card is saved to your account automatically.</p><p id="uStat" style="text-align:center"></p>`}</div>
  <p style="text-align:center"><a href="#" style="color:var(--mut)">← back</a></p></div>`;
  if (mode === 'in') ACT.mtap();
}
function meShell() {
  $('.me').insertAdjacentHTML('beforeend', `<div class="nav"><div>${ME_TABS.map(([k, i, n]) => `<button data-act="mtab" data-k="${k}" id="n_${k}"><span>${i}</span>${n}</button>`).join('')}</div></div>`);

}
function meShow(k) {
  stopMeter(); meCur = k;
  document.querySelectorAll('.nav button').forEach(b => b.classList.toggle('on', b.id === 'n_' + k));
  $('#mv').innerHTML = ME[k].html(); ME[k].init?.(); ME[k].refresh?.();
}
const ME = {};
ME.home = {

ME.bills = {
  html: () => `<h2>Bills</h2><div class="card" id="bBody"></div>`,
  refresh() {
    const list = Object.entries(M.bills).filter(([, b]) => billVisible(b)).sort((a, b) => (b[1].created || 0) - (a[1].created || 0));
    $('#bBody').innerHTML = list.length ? list.map(([id, b]) => `<div class="item"><div>${esc(b.title)}<br><span class="mut">${b.due ? 'Due ' + esc(b.due) : ''}</span></div><div class="row"><b>${money(b.amount)}</b>${b.status === 'paid' ? '<span class="pill ok">paid</span>' : `<button class="btn sm" data-act="mpay" data-id="${id}">Pay</button>`}</div></div>`).join('') : '<p class="mut">You have no bills 🎉</p>';
  }
};
ME.phone = {
  html: () => `<h2>Phone</h2><div id="phBody"></div>`,
  refresh() {
    const l = M.acc.line;
    if (!l) {
      if (!M.nums) M.nums = genNums();
      $('#phBody').innerHTML = `<div class="card"><h3>Get a phone line · ${money(LINE_PRICE)}</h3><p class="mut">Pick your number:</p>${M.nums.map(n => `<div class="item"><b>${n}</b><button class="btn sm" data-act="mbuyline" data-num="${n}">Buy</button></div>`).join('')}<p><button class="btn ghost sm" data-act="mnums">🔄 Other numbers</button></p></div>`;
    } else {
      $('#phBody').innerHTML = `<div class="card"><div class="item"><span class="mut">Your number</span><b>${esc(l.number)}</b></div><div class="item"><span class="mut">Data left</span><b>${l.dataMB || 0} MB</b></div></div>
      <h3>Buy a package</h3>${PACKS.map(p => `<div class="pk"><div><b>${p.name}</b><br><span class="mut">${p.mb} MB · ${Math.floor(p.mb / 60)} min on Instazyad</span></div><button class="btn sm" data-act="mbuypack" data-id="${p.id}">${money(p.price)}</button></div>`).join('')}`;
    }
  }
};
ME.send = {
  html: () => `<h2>Send money</h2><div class="card"><label>To username<input id="sTo" autocapitalize="none" maxlength="16"></label><label>Amount (${CUR})<input id="sAmt" type="number" step="0.01" min="0"></label><button class="btn big" data-act="msend">Send</button></div>`
};
ME.hist = {
  html: () => `<h2>History</h2><div class="card" id="hiBody"></div>`,
  refresh() {
    const l = Object.values(M.tx).sort((a, b) => (b.ts || 0) - (a.ts || 0)).slice(0, 60);
    $('#hiBody').innerHTML = l.length ? l.map(t => `<div class="item"><div>${esc(t.desc)}<br><span class="mut">${when(t.ts)}</span></div><b class="${t.amount < 0 ? 'bad' : 'ok'}">${t.amount < 0 ? '−' : '+'}${money(Math.abs(t.amount))}</b></div>`).join('') : '<p class="mut">No transactions yet.</p>';
  }
};

/* --- Instazyad: 1 MB of data per second while open --- */
const meter = { timer: null, pending: 0, inflight: 0 };
const dataLeft = () => Math.max(0, (M.acc?.line?.dataMB || 0) - meter.pending - meter.inflight);
function startMeter() {
  stopMeter();
  meter.timer = setInterval(() => {
    if (document.hidden) return;
    if (dataLeft() <= 0) { flushMeter(); ME.insta.refresh(); stopMeter(); return; }
    meter.pending++; updateMeterUI();
    if (meter.pending >= 5) flushMeter();
  }, 1000);
}
function stopMeter() { if (meter.timer) { clearInterval(meter.timer); meter.timer = null; } flushMeter(); }
async function flushMeter() {
  const n = meter.pending; if (!n || !M.id) return;
  meter.pending = 0; meter.inflight += n;
  try { await runTransaction(ref(db, `accounts/${M.id}/line/dataMB`), c => Math.max(0, (c || 0) - n)); }
  finally { meter.inflight -= n; }
}
function updateMeterUI() {
  const el = $('#dataLeft'); if (el) el.textContent = dataLeft() + ' MB';
  const bar = $('#dataBar'); if (bar) bar.style.width = Math.min(100, dataLeft() / 10) + '%';
}
document.addEventListener('visibilitychange', () => { if (document.hidden) flushMeter(); });
window.addEventListener('pagehide', flushMeter);

ME.insta = {
  html: () => `<div class="card" id="iHead"></div><div id="iBody"></div>`,
  init() { M.iState = ''; startMeter(); },
  refresh() {
    if (!$('#iHead')) return;
    const l = M.acc.line, left = dataLeft();
    const st = !l ? 'noline' : left <= 0 ? 'nodata' : 'ok';
    $('#iHead').innerHTML = `<div class="row between"><b>📸 Instazyad</b><span class="mut">📶 <b id="dataLeft" style="color:var(--text)">${left} MB</b></span></div><div class="meter"><i id="dataBar" style="width:${Math.min(100, left / 10)}%"></i></div><p class="mut" style="margin:8px 0 0;font-size:12px">Using 1 MB per second while this page is open.</p>`;
    if (st === M.iState) return;
    M.iState = st;
    if (st === 'ok') {
      $('#iBody').innerHTML = `<div class="card"><textarea id="pText" rows="2" placeholder="What's on your mind?"></textarea>
      <div id="pPrev"></div><div class="row between" style="margin-top:10px"><label class="btn ghost sm" style="margin:0;cursor:pointer">🖼️ Photo<input type="file" id="pFile" accept="image/*" hidden></label><button class="btn" data-act="mpost">Post</button></div></div><div class="card" id="feed"></div>`;
      $('#pFile').onchange = pickImg; ME.insta.feed();
    } else {
      stopMeter();
      $('#iBody').innerHTML = `<div class="card big-ok"><div class="tick">${st === 'noline' ? '📵' : '🪫'}</div><h3>${st === 'noline' ? 'You need a phone line first' : "You're out of data"}</h3><p class="mut">${st === 'noline' ? 'Buy a line, then a package, to use Instazyad.' : 'Buy a package to keep scrolling.'}</p><button class="btn" data-act="mtab" data-k="phone">Go to Phone</button></div>`;
    }
  },
  feed() {
    const el = $('#feed'); if (!el) return;
    const list = Object.entries(M.posts).sort((a, b) => (b[1].ts || 0) - (a[1].ts || 0));
    el.innerHTML = list.length ? list.map(([id, p]) => {
      const likes = Object.keys(p.likes || {}).length, mine = p.likes?.[M.id];
      return `<div class="post"><div class="row" style="flex-wrap:nowrap"><div class="av">${esc((p.name || '?')[0].toUpperCase())}</div><div><b>${esc(p.name)}</b><br><span class="mut" style="font-size:12px">${when(p.ts)}</span></div></div>
      ${p.text ? `<p style="margin:10px 0 0;white-space:pre-wrap">${esc(p.text)}</p>` : ''}${p.img ? `<img src="${esc(p.img)}" alt="">` : ''}
      <div class="row" style="margin-top:10px"><button class="btn ghost sm" data-act="mlike" data-id="${id}">${mine ? '❤️' : '🤍'} ${likes}</button>${p.acc === M.id ? `<button class="btn ghost sm" data-act="mdelpost" data-id="${id}">🗑️</button>` : ''}</div></div>`;
    }).join('') : '<p class="mut">No posts yet — be the first!</p>';
  }
};
function pickImg(e) {
  const f = e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    const s = Math.min(1, 640 / Math.max(img.width, img.height));
    const c = document.createElement('canvas'); c.width = img.width * s; c.height = img.height * s;
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    M.img = c.toDataURL('image/jpeg', 0.6);
    $('#pPrev').innerHTML = `<img src="${M.img}" style="max-height:160px;border-radius:10px;margin-top:8px">`;
  };
  img.src = URL.createObjectURL(f);
}

route();
</script>
</body>
</html>
